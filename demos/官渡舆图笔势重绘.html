<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>建安五年 · 官渡舆图（工笔重绘）</title>
<style>
  :root{
    --paper:#eae2cd; --mount:#d7cfb8; --ink:#33342c;
    --cinnabar:#9c332b; --gold:#a08a58; --dim:#6a6753;
    --serif:"WenQuanYi Micro Hei","Noto Serif CJK SC","Songti SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#c5bda6;color:var(--ink);font-family:var(--serif)}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:20px 14px 16px;gap:12px;
    background:radial-gradient(ellipse at 50% 28%,#ded6c0,#b8b09a 100%)}
  .leaf{position:relative;width:min(1240px,100%);padding:9px;background:var(--mount);
    border:1px solid rgba(90,80,58,.42);
    box-shadow:0 18px 52px rgba(48,42,30,.38),inset 0 0 0 1px rgba(255,255,255,.3)}
  .sheet{position:relative;width:100%;aspect-ratio:1200/880;overflow:hidden;
    background:var(--paper);border:1px solid rgba(90,80,58,.3)}
  canvas{display:block;width:100%;height:100%}

  .colophon{position:absolute;left:2.6%;top:4.8%;display:flex;align-items:flex-start;gap:9px;
    pointer-events:none;user-select:none}
  .colophon .t{writing-mode:vertical-rl;text-orientation:upright;
    font-size:clamp(15px,1.85vw,22px);letter-spacing:6px;color:#33352c;opacity:.92}
  .colophon .s{writing-mode:vertical-rl;font-size:clamp(9px,.95vw,11px);
    letter-spacing:2px;color:#6d6a56;margin-top:4px;opacity:.85}
  .colophon .seal{writing-mode:vertical-rl;text-orientation:upright;margin-top:34px;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;
    background:var(--cinnabar);color:#f2e6d1;font-size:14px;line-height:1;
    border:1px solid rgba(240,190,160,.45);box-shadow:inset 0 0 0 2px rgba(0,0,0,.16);opacity:.9}

  .scale{position:absolute;right:2.4%;bottom:4.2%;display:flex;align-items:flex-end;gap:8px;
    pointer-events:none;user-select:none;opacity:.8}
  .scale .bar{width:96px;height:6px;border:1px solid #5f5a45;
    background:linear-gradient(90deg,#5f5a45 0 25%,transparent 25% 50%,#5f5a45 50% 75%,transparent 75%)}
  .scale .txt{font-size:10px;letter-spacing:1px;color:#5f5a45;line-height:1.6;text-align:right}

  .foot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;
    font-size:11px;color:#5d5949;letter-spacing:1px}
  .foot .note{opacity:.85}
  button{font-family:inherit;font-size:11px;letter-spacing:2px;padding:7px 13px;cursor:pointer;
    color:#4a473a;background:rgba(255,255,255,.24);border:1px solid rgba(90,80,58,.45)}
  button:hover{background:rgba(255,255,255,.52);border-color:var(--gold)}
  button[aria-pressed="true"]{background:rgba(160,138,88,.22);border-color:var(--gold)}
</style>
</head>
<body>
  <div class="leaf">
    <div class="sheet">
      <canvas id="c" aria-label="建安五年官渡舆图：工笔双勾、分区平涂、矮横向山脉、密集地物符号"></canvas>
      <div class="colophon">
        <div class="t">汉末州郡地形图</div>
        <div class="s">建安五年庚辰 · 形象画法 · 纵横不拘实距</div>
        <div class="seal">舆</div>
      </div>
      <div class="scale">
        <div class="txt">每方约百里<br>以水系为脉络</div>
        <div class="bar"></div>
      </div>
    </div>
  </div>
  <div class="foot">
    <span class="note">数据锚点取自 src/map-data.js；城间不画路线，格网由上层直接叠压</span>
    <button id="gridBtn" type="button" aria-pressed="false">压 上 格 子</button>
    <button id="again" type="button">重 落 一 笔</button>
  </div>

<!-- MIT：Copyright (c) 2018 Lingdong Huang，见 third-party/LICENSE-*.txt 与 ATTRIBUTION.md -->
<script src="third-party/ink-stroke.js"></script>
<script>
(() => {
  if (!window.InkStroke) {
    document.body.insertAdjacentHTML('afterbegin',
      '<p style="color:#8a2b22">缺少 third-party/ink-stroke.js，请把整个 demos/ 目录一起打开。</p>');
    return;
  }
  const { rgba, resample, frames, ribbon, hardRibbon, doubleOutline, flatWash, stroke } = InkStroke;

  const W = 1200, H = 880, PAD = 46;
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  let seed = 20261116;
  let showGrid = false;

  // ── 确定性随机 ────────────────────────────────────────────────────────
  const rnd = () => {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const rr = (a,b) => a + (b-a)*rnd();
  const h1 = k => { const v = Math.sin(k*127.1 + seed*0.000131)*43758.5453; return v-Math.floor(v); };

  // ── src/map-data.js 的经纬度锚点（重绘所需字段） ───────────────────────
  const LON_MIN=112.75, LON_MAX=116.15, LAT_MIN=32.65, LAT_MAX=36.65;
  const CITIES = [
    ['许都',113.85,34.03,1],['邺',114.40,36.30,1],['汝南',114.36,33.01,2],
    ['陈留',114.53,34.66,2],['黎阳',114.55,35.68,2],['濮阳',115.03,35.75,2],
    ['阳翟',113.52,34.14,2],['谯县',115.78,33.85,2],['中牟',114.03,34.72,3],
    ['白马',114.45,35.55,3],['延津',114.20,35.15,3],['官渡',114.00,34.55,4],
  ];
  const cityByName = n => CITIES.find(c=>c[0]===n);
  const HUANGHE = [
    [112.78,34.98],[113.05,35.02],[113.35,35.10],[113.62,35.16],[113.88,35.12],
    [114.20,35.15],[114.42,35.48],[114.55,35.68],[114.86,35.74],[115.18,35.78],
    [115.48,36.02],[115.78,36.25],[116.10,36.48],
  ];
  const RIVERS_MINOR = [
    {name:'颍水',w:1.6,pts:[[113.10,33.20],[113.30,33.55],[113.48,33.90],[113.62,34.12],[113.85,34.28],[114.10,34.40]]},
    {name:'汝水',w:1.6,pts:[[113.90,32.70],[114.10,32.95],[114.36,33.15],[114.62,33.40],[114.82,33.72],[115.05,33.95]]},
    {name:'鸿沟',w:1.5,pts:[[113.55,34.30],[113.78,34.42],[114.00,34.55],[114.22,34.62],[114.53,34.66]]},
    {name:'淇水',w:1.3,pts:[[114.05,36.55],[114.25,36.20],[114.40,35.90],[114.55,35.68]]},
    {name:'荡水',w:1.1,pts:[[114.15,36.45],[114.32,36.32],[114.40,36.30]]},
  ];
  const LAKES = [
    {name:'圃田泽',lon:113.90,lat:34.80,rx:.20,ry:.10},
    {name:'荥泽',  lon:113.30,lat:35.02,rx:.14,ry:.08},
    {name:'大野泽',lon:115.62,lat:35.42,rx:.30,ry:.16},
  ];
  const RIDGES = [
    {name:'嵩山',h:.92,pts:[[112.82,33.55],[113.02,33.90],[113.12,34.28],[113.05,34.62],[113.22,34.92]]},
    {name:'箕山',h:.74,pts:[[113.28,33.35],[113.52,33.62],[113.66,33.95],[113.55,34.20]]},
    {name:'太行',h:.96,pts:[[114.05,36.62],[114.35,36.40],[114.62,36.18],[114.86,35.95],[115.10,35.80]]},
    {name:'历山',h:.62,pts:[[115.35,36.55],[115.60,36.38],[115.82,36.20]]},
  ];
  const PASSES = [
    ['虎牢关',113.18,34.82,'pass'],['轘辕关',113.08,34.42,'pass'],
    ['延津渡',114.20,35.15,'ford'],['白马津',114.45,35.55,'ford'],
    ['黎阳津',114.55,35.68,'ford'],['濮阳津',115.03,35.75,'ford'],
    ['官渡口',114.00,34.55,'ford'],
  ];
  // ROADS 只作逻辑锚点保留：按需求，城与城之间不画任何路线，格网由上层叠压。
  const ROAD_HINTS = [
    ['许都','陈留',[[113.95,34.20],[114.20,34.42],[114.45,34.58]]],
    ['许都','汝南',[[113.95,33.78],[114.10,33.48],[114.25,33.20]]],
    ['许都','谯县',[[114.20,33.90],[114.60,33.82],[115.10,33.80],[115.50,33.84]]],
    ['官渡','延津',[[114.06,34.80],[114.14,35.00]]],
    ['黎阳','邺',[[114.48,35.92],[114.42,36.10]]],
  ];

  const proj = (lon,lat) => [
    PAD + (lon-LON_MIN)/(LON_MAX-LON_MIN)*(W-2*PAD),
    PAD + (1-(lat-LAT_MIN)/(LAT_MAX-LAT_MIN))*(H-2*PAD),
  ];
  const PXY = p => proj(p[0],p[1]);

  // ── 纸：干净、低频晕染，工笔不靠纹理抢戏 ───────────────────────────────
  function paper() {
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#f0e9d7'); g.addColorStop(.42,'#e9e1cb');
    g.addColorStop(.78,'#ece4cf'); g.addColorStop(1,'#e4dcc4');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    for (let i=0;i<22;i++) {
      const x=rr(-100,W+100),y=rr(-80,H+80),r=rr(150,380);
      const q=ctx.createRadialGradient(x,y,0,x,y,r);
      q.addColorStop(0,rgba(rnd()>.5?'#fffaf0':'#a3976f',rr(.010,.030)));
      q.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=q; ctx.fillRect(x-r,y-r,r*2,r*2);
    }
    for (let i=0;i<420;i++) {
      const x=rnd()*W,y=rnd()*H;
      ctx.fillStyle=rgba(rnd()>.55?'#877a5c':'#fffaf0',rr(.010,.035));
      ctx.fillRect(x,y,rr(.5,2.2),.6);
    }
    const v=ctx.createRadialGradient(W/2,H/2,H*.30,W/2,H/2,H*.88);
    v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(60,52,36,.13)');
    ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  }

  // ── 图廓 ──────────────────────────────────────────────────────────────
  function border() {
    ctx.strokeStyle='rgba(95,84,58,.58)'; ctx.lineWidth=1.2;
    ctx.strokeRect(16,16,W-32,H-32);
    ctx.strokeStyle='rgba(95,84,58,.30)'; ctx.lineWidth=.8;
    ctx.strokeRect(23,23,W-46,H-46);
    const L=22;
    ctx.strokeStyle='rgba(140,112,62,.66)'; ctx.lineWidth=1.5;
    for (const [x,y,sx,sy] of [[16,16,1,1],[W-16,16,-1,1],[16,H-16,1,-1],[W-16,H-16,-1,-1]]) {
      ctx.beginPath();
      ctx.moveTo(x+sx*L,y); ctx.lineTo(x,y); ctx.lineTo(x,y+sy*L);
      ctx.moveTo(x+sx*9,y+sy*9); ctx.lineTo(x+sx*9,y+sy*L*.7); ctx.lineTo(x+sx*L*.7,y+sy*9);
      ctx.stroke();
    }
  }

  // 可选界格：演示「把逻辑格子压上去」，默认不画，不参与本层绘制
  function gridOverlay() {
    if (!showGrid) return;
    ctx.save();
    ctx.strokeStyle='rgba(120,100,66,.13)'; ctx.lineWidth=.5;
    for (let x=26;x<W-26;x+=42){ ctx.beginPath();ctx.moveTo(x,23);ctx.lineTo(x,H-23);ctx.stroke(); }
    for (let y=23;y<H-23;y+=42){ ctx.beginPath();ctx.moveTo(23,y);ctx.lineTo(W-23,y);ctx.stroke(); }
    ctx.restore();
  }

  // ── 远山：低缓横列硬折线，淡墨平涂（无柔波） ─────────────────────────
  function farHills() {
    const bands = [
      [[58,318],[130,296],[188,308],[250,282],[312,300],[384,278],[452,302],[520,290]],
      [[700,326],[772,300],[842,316],[910,288],[986,310],[1058,292],[1142,314]],
    ];
    for (const [i,raw] of bands.entries()) {
      const P=resample(raw,6);
      const path=new Path2D(); path.moveTo(P[0][0],372);
      for (const p of P) path.lineTo(p[0],p[1]);
      path.lineTo(P[P.length-1][0],372); path.closePath();
      flatWash(ctx,path,'#8b9b96',.055,2);
      hardRibbon(ctx,P,{w:.8,col:'#7d8b82',alpha:.14,head:.04,tail:.16,sk:9+i,seg:7});
    }
  }

  // ── 竖排小字 ──────────────────────────────────────────────────────────
  function vertical(text,x,y,size,col,alpha) {
    ctx.save();
    ctx.font=`${size}px "WenQuanYi Micro Hei","Noto Serif CJK SC",serif`;
    ctx.textAlign='center'; ctx.textBaseline='top';
    for (let i=0;i<text.length;i++) {
      ctx.fillStyle=rgba(col,alpha);
      ctx.fillText(text[i],x,y+i*(size*1.12));
    }
    ctx.restore();
  }

  // ── 泽薮：双勾水线 + 分区平涂 + 横向水纹 ──────────────────────────────
  function lakes() {
    for (const L of LAKES) {
      const [cx,cy]=proj(L.lon,L.lat);
      const rx=L.rx/(LON_MAX-LON_MIN)*(W-2*PAD), ry=L.ry/(LAT_MAX-LAT_MIN)*(H-2*PAD);
      const N=12, pts=[];
      for (let i=0;i<N;i++) {
        const a=i/N*Math.PI*2;
        pts.push([cx+Math.cos(a)*rx*rr(.70,1.24), cy+Math.sin(a)*ry*rr(.62,1.30)]);
      }
      const d=resample([...pts,pts[0],pts[1],pts[2]],4);
      const path=new Path2D(); path.moveTo(d[0][0],d[0][1]);
      for (const p of d) path.lineTo(p[0],p[1]);
      path.closePath();
      flatWash(ctx,path,'#71867e',.075,2);
      doubleOutline(ctx,d,{gap:1.1,col:'#54655c',alpha:.30,sk:rr(0,99)});
      for (let i=0;i<9;i++) {
        const y=cy+rr(-ry*.6,ry*.6), x=cx+rr(-rx*.6,rx*.15), l=rr(rx*.22,rx*.6);
        hardRibbon(ctx,[[x,y],[x+l*.5,y+rr(-1,1)],[x+l,y]],
          {w:.6,col:'#5c7276',alpha:rr(.10,.20),head:.08,tail:.3,sk:rr(0,99),seg:3});
      }
      vertical(L.name,cx+rx*.78,cy-ry*.55,10,'#5a5d4c',.66);
    }
  }

  // ── 河：双勾水线 + 极淡平涂，不铺大面积青色 ───────────────────────────
  function river(pts, width, name, major) {
    const P=resample(pts.map(PXY),5), F=frames(P);
    const A=P.map((p,i)=>[p[0]+F[i].nx*width,p[1]+F[i].ny*width]);
    const B=P.map((p,i)=>[p[0]-F[i].nx*width,p[1]-F[i].ny*width]);
    const path=new Path2D(); path.moveTo(A[0][0],A[0][1]);
    for (const p of A) path.lineTo(p[0],p[1]);
    for (let i=B.length-1;i>=0;i--) path.lineTo(B[i][0],B[i][1]);
    path.closePath();
    flatWash(ctx,path,'#6f8a86',major?.055:.035,2);
    // 岸线切成断续短笔（笔断意连）：一整条贯穿画面的连续双线会读成道路/边界，
    // 古图的大河靠断续岸笔 + 水纹认出来，不靠一根长实线。
    const broken=(Q,o)=>{
      const step=12, gap=2;
      for (let i=0;i<Q.length-gap;i+=step+gap) {
        const seg=Q.slice(i,Math.min(Q.length,i+step));
        if (seg.length>2) ribbon(ctx,seg,o);
      }
    };
    const bank={w:major?.78:.52,col:'#5c7d84',alpha:major?.30:.22,
                head:.05,tail:.16,sk:rr(0,99),dry:.34,bristles:3};
    broken(A,bank);
    broken(B,{...bank,alpha:major?.25:.18,sk:rr(0,99)});
    // 水纹：不等距的短横组，不是长波
    const count=major?28:9;
    for (let k=0;k<count;k++) {
      const i=Math.floor(rr(.04,.95)*(P.length-1)), f=F[i];
      const off=rr(-width*.5,width*.5);
      const x=P[i][0]+f.nx*off, y=P[i][1]+f.ny*off;
      const l=rr(7,major?20:12);
      ribbon(ctx,[[x-f.nx*l*.5,y-f.ny*l*.5],[x+f.nx*l*.5,y+f.ny*l*.5]],
        {w:.5,col:'#5c7d84',alpha:rr(.12,.24),head:.1,tail:.3,sk:rr(0,99)});
    }
    if (name) {
      const i=Math.floor(P.length*.60), f=F[i];
      vertical(name,P[i][0]+f.nx*(width+10),P[i][1]+f.ny*(width+10)-10,
        major?11:9,'#4c6062',major?.76:.62);
    }
  }

  // ── 山：横向铺展、峰头低缓、方硬折带、山脚横向坡带 ────────────────────
  // 四点修正：① 高度压到 ~1/3、山脚只出 12px 横向坡带，不再往下垂成柱子
  //          ② 轮廓用折线硬折 + 斧劈/折带短硬笔，不用柔顺曲线
  //          ③ 双勾 + 分区平涂逐层薄罩 + 水线，走工笔
  //          ④ 密符号补在下面的 symbols()，不靠把山画大来填画面
  function ridge(rg) {
    const raw=rg.pts.map(PXY);
    let x0=Math.min(...raw.map(p=>p[0])), x1=Math.max(...raw.map(p=>p[0]));
    const yc=raw.reduce((s,p)=>s+p[1],0)/raw.length;
    if (x1-x0<170){ const m=(x0+x1)/2; x0=m-105; x1=m+105; }
    x0=Math.max(56,x0-20); x1=Math.min(W-56,x1+20);
    const foot=Math.min(H-72,yc+34+rg.h*16);
    const amp=26+rg.h*34;                       // 原 58+96h：压低到约 1/3

    // 峰头：显式折点、分段线性 —— 峰顶是尖角不是圆弧，山不读成圆丘
    const peakT=[.10,.30,.52,.74,.92];
    const peakH=[.42,.88,.62,1.0,.38];
    const knots=[[0,.05]];
    for (let k=0;k<peakT.length;k++) {
      knots.push([peakT[k]-.055,.18+.10*h1(k+rg.h*7)]);
      knots.push([peakT[k],peakH[k]*(.86+.14*h1(k*2.3+rg.h*11))]);
      knots.push([peakT[k]+.055,.16+.12*h1(k+3.1)]);
    }
    knots.push([1,.05]); knots.sort((a,b)=>a[0]-b[0]);
    const K=54, ctrl=[];
    for (let k=0;k<=K;k++) {
      const t=k/K;
      let i=0; while (i<knots.length-2 && knots[i+1][0]<t) i++;
      const a=knots[i], b=knots[i+1];
      const f=Math.min(1,Math.max(0,(t-a[0])/((b[0]-a[0])||1)));
      ctrl.push([x0+t*(x1-x0),foot-amp*Math.max(.045,a[1]+(b[1]-a[1])*f)]);
    }
    const T=resample(ctrl,3), F=frames(T);
    const base=[];
    for (let k=0;k<=K;k++) {
      const t=k/K;
      base.push([x0+t*(x1-x0),foot+rr(1,4)]);
    }
    const Bb=resample(base,5);

    // 山体：一整块分区平涂
    const body=new Path2D(); body.moveTo(T[0][0],T[0][1]);
    for (const p of T) body.lineTo(p[0],p[1]);
    for (let i=Bb.length-1;i>=0;i--) body.lineTo(Bb[i][0],Bb[i][1]);
    body.closePath();
    flatWash(ctx,body,'#8f9c84',.10,2);

    // 峰面分区：每个折段一个三角形，受光赭 / 背阴青绿，逐层薄罩，留水线
    for (let i=0;i<T.length-6;i+=6) {
      const a=T[i], b=T[Math.min(T.length-1,i+6)];
      const bx=[b[0],foot], ax=[a[0],foot];
      const face=new Path2D(); face.moveTo(a[0],a[1]);
      for (let k=i;k<=Math.min(T.length-1,i+6);k++) face.lineTo(T[k][0],T[k][1]);
      face.lineTo(bx[0],bx[1]); face.lineTo(ax[0],ax[1]); face.closePath();
      const lit=(i/6)%2===0;
      flatWash(ctx,face,lit?'#b39a6c':'#6f8a80',lit?.125:.155,3);
      // 双勾一条内轮廓，留一线纸白水线
      const seg=T.slice(i,Math.min(T.length-1,i+6)+1);
      doubleOutline(ctx,seg,{gap:1.0,col:'#4f5a4c',alpha:.40,sk:i});
    }

    // 折带皴：短横 + 方折斜下，硬笔、不柔
    const clusters=[[.04,.24,7],[.24,.46,9],[.46,.68,9],[.68,.94,7]];
    for (const [a,b,n] of clusters) {
      for (let k=0;k<n;k++) {
        const t=a+(b-a)*(k+rr(.1,.9))/n, i=Math.floor(t*(T.length-1));
        const sx=T[i][0]+rr(-2,2), sy=T[i][1]+rr(3,8);
        const len=Math.min(amp*rr(.14,.30),foot-sy-4);
        if (len<3) continue;
        // 折带：以横走为主，末端只作一次短方折，不再往下垂长笔
        const bend=rr(8,15);
        hardRibbon(ctx,[[sx,sy],[sx+bend,sy+rr(-1,1)],[sx+bend+len*.16,sy+len]],
          {w:rr(.75,1.25),col:rnd()>.45?'#4b5542':'#6b5b43',
           alpha:rr(.18,.30),head:.06,tail:.42,sk:rr(0,99),seg:3});
        if (rnd()>.62) {  // 斧劈：侧锋短斜擦，几乎横走
          hardRibbon(ctx,[[sx-len*.3,sy+len*.45],[sx+rr(6,13),sy+len*.45+rr(1,3)]],
            {w:rr(1.0,1.7),col:'#4c5645',alpha:rr(.14,.24),head:.08,tail:.4,sk:rr(0,99),seg:2});
        }
      }
    }
    // 主脊亮墨 + 纸白提光（读成受光的棱）
    hardRibbon(ctx,T,{w:1.15,col:'#5f6049',alpha:.52,head:.03,tail:.10,sk:rr(0,99),seg:11});
    ribbon(ctx,T.map(p=>[p[0],p[1]-1.6]),
      {w:.6,col:'#f7efd8',alpha:.55,head:.03,tail:.08,sk:rr(0,99)});

    // 山脚：横向赭色坡带（只有 10~16px，不再往下垂）
    const footA=T.map(p=>[p[0],foot+rr(0,2)]);
    const footB=T.map(p=>[p[0],foot+rr(11,16)+3*Math.sin(p[0]*.021)]);
    const band=new Path2D(); band.moveTo(footA[0][0],footA[0][1]);
    for (const p of footA) band.lineTo(p[0],p[1]);
    for (let i=footB.length-1;i>=0;i--) band.lineTo(footB[i][0],footB[i][1]);
    band.closePath();
    flatWash(ctx,band,'#a9794f',.14,2);
    // 坡脚用断续横向短线暗示，不画实线（实线是死的）
    for (let i=0;i<T.length-3;i+=5) {
      const x=T[i][0], y=foot+rr(12,17);
      hardRibbon(ctx,[[x,y],[x+rr(7,16),y+rr(-1,1)]],
        {w:.7,col:'#7d6447',alpha:rr(.18,.30),head:.1,tail:.3,sk:rr(0,99),seg:2});
    }
    // 苔点聚在折角
    for (const t of [.16,.33,.50,.67,.84]) {
      const i=Math.floor(t*(T.length-1));
      for (let k=0;k<2;k++) {
        ctx.fillStyle=rgba('#46543f',rr(.20,.38));
        ctx.fillRect(T[i][0]+rr(-6,6),T[i][1]+rr(6,14),rr(1.2,2.3),rr(1,2));
      }
    }
    let bi=0; for (let i=1;i<T.length;i++) if (T[i][1]<T[bi][1]) bi=i;
    vertical(rg.name,T[bi][0]+11,T[bi][1]-4,11,'#4a4c3d',.76);
  }

  // ── 城：界画双勾，加子城、门楼、角楼、旗、城内署廨 ────────────────────
  function city(c) {
    const [name,lon,lat,rank]=c;
    const [x,y]=proj(lon,lat);
    const s=rank===1?30:rank===2?24:rank===3?20:17, h=s*.64;
    const L=x-s,R=x+s,T=y-h,B=y+h;
    ctx.save();
    // 双勾城墙：外线 + 内线，中间留纸白
    ctx.strokeStyle='rgba(68,66,52,.86)'; ctx.lineWidth=1.5;
    ctx.strokeRect(L,T,s*2,h*2);
    ctx.strokeStyle='rgba(68,66,52,.42)'; ctx.lineWidth=.8;
    ctx.strokeRect(L+2.5,T+2.5,s*2-5,h*2-5);
    ctx.strokeStyle='rgba(247,239,216,.72)'; ctx.lineWidth=.7;
    ctx.strokeRect(L+1.4,T+1.4,s*2-2.8,h*2-2.8);
    // 子城（都城/州治）
    if (rank<=2) {
      const u=s*.42;
      ctx.strokeStyle='rgba(68,66,52,.66)'; ctx.lineWidth=1;
      ctx.strokeRect(x-u,T+4,u*2,h*.86);
      ctx.strokeStyle='rgba(247,239,216,.6)'; ctx.lineWidth=.6;
      ctx.strokeRect(x-u+1.2,T+5.2,u*2-2.4,h*.86-2.4);
    }
    // 城内署廨：两三格小房，双勾
    ctx.strokeStyle='rgba(68,66,52,.5)'; ctx.lineWidth=.7;
    for (const [ox,oy] of [[-s*.55,h*.1],[s*.3,-h*.25],[s*.42,h*.28]]) {
      const w=rr(4,7), ht=rr(3.5,5.5);
      ctx.strokeRect(x+ox,T+h+oy,w,ht);
      ctx.beginPath(); ctx.moveTo(x+ox-1,T+h+oy); ctx.lineTo(x+ox+w/2,T+h+oy-3);
      ctx.lineTo(x+ox+w+1,T+h+oy); ctx.stroke();
    }
    // 垛口：三组、组内不等距
    ctx.fillStyle='rgba(68,66,52,.72)';
    for (const [a,b] of [[L+4,L+s*.6],[L+s*.8,L+s*1.3],[R-s*.5,R-4]]) {
      let px=a;
      while (px<b-3){ const w=rr(2.8,4.8); ctx.fillRect(px,T-rr(3,4.6),w,rr(3,4.6)); px+=w+rr(2,4.6); }
    }
    // 门楼：下墙开阙 + 双层歇山
    const gw=s*.48;
    ctx.fillStyle='rgba(234,226,205,.96)'; ctx.fillRect(x-gw/2,B-1,gw,3.5);
    ctx.strokeStyle='rgba(68,66,52,.86)'; ctx.lineWidth=1.3;
    ctx.beginPath();
    ctx.moveTo(x-gw/2,B+2); ctx.lineTo(x-gw/2,T+h*.55);
    ctx.moveTo(x+gw/2,B+2); ctx.lineTo(x+gw/2,T+h*.55); ctx.stroke();
    for (const [ly,ww] of [[T+h*.55,gw*.95],[T+h*.30,gw*.78]]) {
      ctx.beginPath();
      ctx.moveTo(x-ww,ly); ctx.lineTo(x-ww*.66,ly-5);
      ctx.lineTo(x+ww*.66,ly-5); ctx.lineTo(x+ww,ly);
      ctx.moveTo(x-ww*.78,ly-5); ctx.lineTo(x,ly-9); ctx.lineTo(x+ww*.78,ly-5);
      ctx.stroke();
    }
    // 角楼
    ctx.strokeStyle='rgba(68,66,52,.62)'; ctx.lineWidth=1;
    for (const [cx,cy] of [[L,T],[R,T],[L,B],[R,B]]) {
      ctx.strokeRect(cx-3,cy-3,6,6);
      ctx.beginPath(); ctx.moveTo(cx-4.5,cy-3); ctx.lineTo(cx,cy-6); ctx.lineTo(cx+4.5,cy-3); ctx.stroke();
    }
    // 旗杆
    ctx.strokeStyle='rgba(120,72,48,.7)'; ctx.lineWidth=.9;
    ctx.beginPath(); ctx.moveTo(R-6,T-4); ctx.lineTo(R-6,T-16); ctx.stroke();
    ctx.fillStyle='rgba(156,51,43,.62)';
    ctx.beginPath(); ctx.moveTo(R-6,T-16); ctx.lineTo(R+2,T-13); ctx.lineTo(R-6,T-10); ctx.closePath(); ctx.fill();
    ctx.restore();

    const fs=rank===1?15:rank===2?13:rank===3?11:10;
    vertical(name,R+10,T-2,fs,'#33352c',.92);
    const by=T+name.length*(fs*1.12)+3, bs=rank===1?10:8;
    ctx.fillStyle=rgba('#9c332b',.86); ctx.fillRect(R+6,by,bs,bs);
    ctx.fillStyle=rgba('#f2e6d1',.95);
    ctx.font=`${rank===1?8:7}px serif`; ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.fillText(rank===1?'都':rank===2?'郡':rank===3?'县':'垒',R+6+bs/2,by+1);
    // 小字注：等级与户数感，不编具体数字
    vertical(rank===1?'州治':rank===2?'郡治':rank===3?'县邑':'营垒',
      R+10+fs*1.2,T+4,8,'#6a6753',.62);
  }

  // ── 关隘 / 津渡 ───────────────────────────────────────────────────────
  function passesFords() {
    for (const [name,lon,lat,kind] of PASSES) {
      const [x,y]=proj(lon,lat);
      if (kind==='pass') {
        ctx.strokeStyle='rgba(110,68,46,.86)'; ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(x,y+6); ctx.lineTo(x,y-10); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y-10); ctx.lineTo(x+12,y-6); ctx.lineTo(x,y-2); ctx.closePath();
        ctx.fillStyle='rgba(156,51,43,.62)'; ctx.fill();
        ctx.strokeStyle='rgba(110,68,46,.72)'; ctx.stroke();
        ctx.strokeStyle='rgba(247,239,216,.7)'; ctx.lineWidth=.6;
        ctx.beginPath(); ctx.moveTo(x+2,y-8); ctx.lineTo(x+9,y-6); ctx.stroke();
      } else {
        ctx.strokeStyle='rgba(70,94,94,.82)'; ctx.lineWidth=1.1;
        ctx.beginPath(); ctx.moveTo(x-8,y+2);
        ctx.quadraticCurveTo(x,y+8,x+8,y+2);
        ctx.quadraticCurveTo(x,y+5,x-8,y+2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y+2); ctx.lineTo(x,y-8); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x,y-8); ctx.lineTo(x+5,y-5); ctx.lineTo(x,y-3); ctx.stroke();
      }
      vertical(name,x+11,y-11,9,kind==='pass'?'#7a4a34':'#4c6062',.80);
    }
  }

  // ── 密集小符号：簇状分布，不是均匀网格 ────────────────────────────────
  // 参考《平江图》「多而不乱」：三角、塔、寺、村舍、田畴、桥、舟、印、旗。
  function poissonClusters(anchors, count, minDist) {
    const pts=[];
    let guard=0;
    while (pts.length<count && guard++<count*60) {
      const a=anchors[Math.floor(rnd()*anchors.length)];
      const x=a[0]+rr(-a[2],a[2]), y=a[1]+rr(-a[3],a[3]);
      if (x<52||x>W-52||y<52||y>H-52) continue;
      // 让开城郭与题识区
      if (x<128 && y<216) continue;
      if (pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<minDist)) continue;
      pts.push([x,y]);
    }
    return pts;
  }
  const anchors = () => {
    const a=[];
    for (const c of CITIES){ const p=proj(c[1],c[2]); a.push([p[0]+34,p[1],44,38]); }
    for (const r of RIVERS_MINOR){ const p=PXY(r.pts[Math.floor(r.pts.length/2)]); a.push([p[0],p[1]+18,52,34]); }
    for (const rg of RIDGES){ const p=PXY(rg.pts[Math.floor(rg.pts.length/2)]); a.push([p[0],p[1]+46,56,30]); }
    for (const l of LAKES){ const p=proj(l.lon,l.lat); a.push([p[0]+30,p[1]+22,46,30]); }
    for (const rd of ROAD_HINTS){ for (const v of rd[2]){ const p=PXY(v); a.push([p[0],p[1],40,34]); } }
    return a;
  };

  function triangle(x,y,s,alpha) {
    ctx.save();
    ctx.strokeStyle=rgba('#6a6350',alpha); ctx.lineWidth=.9;
    ctx.beginPath(); ctx.moveTo(x,y-s*.55); ctx.lineTo(x+s*.5,y+s*.45);
    ctx.lineTo(x-s*.5,y+s*.45); ctx.closePath(); ctx.stroke();
    ctx.strokeStyle=rgba('#f5eed9',alpha*.6); ctx.lineWidth=.55;
    ctx.beginPath(); ctx.moveTo(x,y-s*.35); ctx.lineTo(x+s*.32,y+s*.3);
    ctx.lineTo(x-s*.32,y+s*.3); ctx.closePath(); ctx.stroke();
    ctx.restore();
  }
  function pagoda(x,y,sc) {
    ctx.save();
    ctx.strokeStyle='rgba(68,66,52,.74)'; ctx.lineWidth=.9;
    const w=7*sc, lv=4, hh=6*sc;
    for (let k=0;k<lv;k++) {
      const yy=y-k*hh, ww=w*(1-k*.15);
      ctx.strokeRect(x-ww/2,yy-hh,ww,hh);
      ctx.beginPath();
      ctx.moveTo(x-ww*.72,yy-hh); ctx.lineTo(x-ww*.5,yy-hh-2.2*sc);
      ctx.lineTo(x+ww*.5,yy-hh-2.2*sc); ctx.lineTo(x+ww*.72,yy-hh); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(x,y-lv*hh-2*sc); ctx.lineTo(x,y-lv*hh-7*sc); ctx.stroke();
    ctx.restore();
  }
  function shrine(x,y) {
    ctx.save();
    ctx.strokeStyle='rgba(68,66,52,.62)'; ctx.lineWidth=.8;
    ctx.strokeRect(x-6,y-5,12,9);
    ctx.beginPath(); ctx.moveTo(x-8,y-5); ctx.lineTo(x,y-9); ctx.lineTo(x+8,y-5); ctx.stroke();
    for (const dx of [-4,0,4]) { ctx.beginPath(); ctx.moveTo(x+dx,y-5); ctx.lineTo(x+dx,y+4); ctx.stroke(); }
    ctx.restore();
  }
  function hut(x,y) {
    ctx.save();
    ctx.strokeStyle='rgba(74,80,62,.66)'; ctx.lineWidth=.8;
    for (let k=0;k<2;k++) {
      const ox=k*7-3, oy=rr(-2,2);
      ctx.strokeRect(x+ox,y+oy-4,6,5);
      ctx.beginPath(); ctx.moveTo(x+ox-1.5,y+oy-4); ctx.lineTo(x+ox+3,y+oy-8);
      ctx.lineTo(x+ox+7.5,y+oy-4); ctx.stroke();
    }
    ctx.restore();
  }
  function field(x,y,ang) {
    ctx.save();
    ctx.strokeStyle='rgba(96,104,78,.40)'; ctx.lineWidth=.6;
    const n=4+Math.floor(rnd()*5), ca=Math.cos(ang), sa=Math.sin(ang);
    for (let k=0;k<n;k++) {
      const oy=(k-(n-1)/2)*2.8, l=rr(9,17);
      ctx.beginPath();
      ctx.moveTo(x+(-l/2)*ca-oy*sa, y+(-l/2)*sa+oy*ca);
      ctx.lineTo(x+(l/2)*ca-oy*sa, y+(l/2)*sa+oy*ca);
      ctx.stroke();
    }
    ctx.restore();
  }
  function archBridge(x,y,w) {
    ctx.save();
    ctx.strokeStyle='rgba(88,78,56,.72)'; ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(x-w/2,y+3); ctx.quadraticCurveTo(x,y-6,x+w/2,y+3);
    ctx.moveTo(x-w/2,y+6); ctx.quadraticCurveTo(x,y-3,x+w/2,y+6);
    ctx.stroke();
    ctx.strokeStyle='rgba(247,239,216,.6)'; ctx.lineWidth=.5;
    ctx.beginPath(); ctx.moveTo(x-w/2+1,y+4.4); ctx.quadraticCurveTo(x,y-4.6,x+w/2-1,y+4.4); ctx.stroke();
    ctx.restore();
  }
  function boat(x,y) {
    ctx.save();
    ctx.strokeStyle='rgba(70,86,82,.7)'; ctx.lineWidth=.9;
    ctx.beginPath(); ctx.moveTo(x-7,y); ctx.lineTo(x,y+4); ctx.lineTo(x+7,y);
    ctx.moveTo(x,y+4); ctx.lineTo(x+1,y-7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+1,y-7); ctx.lineTo(x+6,y-4); ctx.lineTo(x+1,y-2); ctx.stroke();
    ctx.restore();
  }
  function stamp(x,y,txt) {
    ctx.save();
    ctx.fillStyle='rgba(156,51,43,.72)'; ctx.fillRect(x,y,13,13);
    ctx.strokeStyle='rgba(247,239,216,.72)'; ctx.lineWidth=.6; ctx.strokeRect(x+1.5,y+1.5,10,10);
    ctx.fillStyle='rgba(247,239,216,.94)';
    ctx.font='8px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(txt,x+6.5,y+7);
    ctx.restore();
  }
  function beacon(x,y) {
    ctx.save();
    ctx.strokeStyle='rgba(110,68,46,.7)'; ctx.lineWidth=.8;
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-9); ctx.stroke();
    ctx.strokeStyle='rgba(156,51,43,.55)';
    ctx.beginPath(); ctx.moveTo(x-4,y-9); ctx.lineTo(x,y-13); ctx.lineTo(x+4,y-9); ctx.stroke();
    ctx.restore();
  }

  function symbols() {
    const A=anchors();
    // 三角符：成簇，大小朝向不等
    const tri=poissonClusters(A,64,19);
    for (const [x,y] of tri) {
      const n=1+Math.floor(rnd()*3);
      for (let k=0;k<n;k++) triangle(x+rr(-7,7),y+rr(-6,6),rr(6,11),rr(.42,.72));
    }
    // 田畴：斜排短线组，方向随组变
    const fld=poissonClusters(A,26,26);
    for (let i=0;i<fld.length;i++) {
      const [x,y]=fld[i], ang=rr(-.75,-.35)*(rnd()>.5?1:-1);
      for (let k=0;k<2+Math.floor(rnd()*2);k++) field(x+rr(-12,12),y+rr(-8,8),ang);
    }
    // 塔 / 寺 / 村舍 / 烽燧
    for (const [x,y] of poissonClusters(A,7,54)) pagoda(x,y,rr(.75,1.15));
    for (const [x,y] of poissonClusters(A,9,44)) shrine(x,y);
    for (const [x,y] of poissonClusters(A,14,32)) hut(x,y);
    for (const [x,y] of poissonClusters(A,9,48)) beacon(x,y);
    // 印
    const chars=['军','屯','田','仓','驿','津','关','郡'];
    poissonClusters(A,7,70).forEach(([x,y],i)=>stamp(x,y,chars[i%chars.length]));
    // 注记：小字竖排，密度补空
    const notes=['营','坞','亭','陂','渠','坂','谷','戍','聚','驿','仓','厩','井','市'];
    for (const [x,y] of poissonClusters(A,18,36)) {
      vertical(notes[Math.floor(rnd()*notes.length)],x,y,8,'#6a6753',rr(.52,.72));
    }
  }

  // 桥与舟：沿河定位置，不是均匀撒
  function bridgesBoats() {
    const onRiver=(pts,ts) => { const P=resample(pts.map(PXY),5); return ts.map(t=>P[Math.floor(t*(P.length-1))]); };
    for (const p of onRiver(HUANGHE,[.16,.34,.52,.70,.86])) archBridge(p[0]+rr(-6,6),p[1]+rr(-4,4),rr(15,24));
    for (const r of RIVERS_MINOR) for (const p of onRiver(r.pts,[.30,.68])) archBridge(p[0],p[1]+2,rr(12,18));
    for (const p of onRiver(HUANGHE,[.10,.24,.40,.58,.74,.92])) boat(p[0]+rr(-8,8),p[1]+rr(-6,6));
    for (const p of onRiver(RIVERS_MINOR[0].pts,[.2,.55,.85])) boat(p[0]+rr(-6,6),p[1]+rr(-5,5));
    const b=PXY([114.00,34.55]); archBridge(b[0],b[1],20);
  }

  // ── 绘制顺序（古法：纸→廓→泽→河→山→林→符号→城→关津→压格） ──────────
  function draw() {
    const rect=cv.getBoundingClientRect();
    const dpr=Math.min(2,window.devicePixelRatio||1);
    cv.width=Math.round(rect.width*dpr); cv.height=Math.round(rect.height*dpr);
    ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
    ctx.clearRect(0,0,W,H);
    paper();
    border();
    farHills();
    lakes();
    river(HUANGHE,8.6,'河水',true);
    for (const r of RIVERS_MINOR) river(r.pts,r.w,r.name,false);
    for (const rg of RIDGES) ridge(rg);
    bridgesBoats();
    symbols();
    for (const c of CITIES) city(c);
    passesFords();
    gridOverlay();
  }

  document.getElementById('again').addEventListener('click',()=>{ seed=(seed+7919)>>>0; draw(); });
  const gb=document.getElementById('gridBtn');
  gb.addEventListener('click',()=>{ showGrid=!showGrid; gb.setAttribute('aria-pressed',String(showGrid)); draw(); });
  window.addEventListener('resize',draw);
  if (document.fonts?.ready) document.fonts.ready.then(draw); else draw();
})();
</script>
</body>
</html>
