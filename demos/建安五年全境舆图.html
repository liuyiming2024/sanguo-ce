<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建安五年全境舆图 · 十三州</title>
<style>
  :root{
    --ink:#0a0d0c; --paper:#e9e3d1; --paper2:#c9c2ad;
    --gold:#c8a86a; --gold2:#8d7546; --red:#a63129; --red2:#d05a4b;
    --line:rgba(200,168,106,.26); --dim:#8f998b;
    --serif:"Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0d0c;color:#ddd7c4;font-family:var(--serif)}
  #wrap{position:absolute;inset:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  canvas.drag{cursor:grabbing}
  #bar{position:absolute;right:12px;top:12px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 24px)}
  #bar button{padding:7px 11px;border:1px solid var(--line);border-radius:2px;
    background:rgba(10,14,12,.86);color:var(--paper2);font-family:var(--serif);font-size:12px;
    letter-spacing:1px;cursor:pointer;min-height:34px}
  #bar button:hover{border-color:var(--gold);color:var(--gold)}
  #bar button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);background:rgba(10,14,12,.92)}
  #gridState{position:absolute;right:12px;bottom:12px;z-index:10;padding:6px 10px;
    border:1px solid var(--line);border-radius:2px;background:rgba(10,14,12,.86);
    font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;pointer-events:none}
  #tip{position:absolute;left:12px;bottom:12px;z-index:10;font-size:11px;color:#c9c2ad;
    line-height:1.7;pointer-events:none;background:rgba(10,14,12,.82);
    border:1px solid rgba(200,168,106,.26);border-radius:2px;padding:5px 9px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="bar">
    <button id="redraw">重落一笔</button>
    <button id="toggleFeatures" aria-pressed="true">地物层</button>
    <button id="toggleInk" aria-pressed="true">工笔</button>
    <button id="toggleGrid" aria-pressed="true">压上格子</button>
    <button id="toggleDetail" aria-pressed="false">中原详图</button>
    <button id="viewHebei" aria-pressed="false">河北详图</button>
    <button id="viewJingyang" aria-pressed="false">荆扬详图</button>
    <button id="zoomIn">放大</button>
    <button id="zoomOut">缩小</button>
    <button id="reset">复位</button>
  </div>
  <div id="tip">滚轮缩放 · 拖动平移 · 建安五年二月 · 纵横不拘实距</div>
  <div id="gridState">—</div>
</div>
<script>
/* 建安五年全境舆图。全部由连续场 + 一次性路径生成，无格网平铺、无位图。
   史料依据见 docs/十三州全境取数表.md、docs/背景层落地清单.md。 */
(() => {
'use strict';
const W = 1400, H = 1100;
const LON0=93, LON1=126, LAT0=15, LAT1=43;           // 图幅：西止玉门、东含乐浪、南含日南
const lon2x = l => (l-LON0)/(LON1-LON0)*W;
const lat2y = t => (LAT1-t)/(LAT1-LAT0)*H;
const x2lon = x => LON0 + x/W*(LON1-LON0);
const y2lat = y => LAT1 - y/H*(LAT1-LAT0);
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const DPR = Math.min(2, window.devicePixelRatio||1);
cv.width = W*DPR; cv.height = H*DPR;
ctx.scale(DPR,DPR);

let seed = 202005, zoom = 1, panX = 0, panY = 0, showFeatures = true, showGrid = true;
let bg = null, fg = null, dragging = false, lastX = 0, lastY = 0;
let focus = 'all', showInk = true;
/* 注记不再烘进离屏图层：按比例尺分级、屏幕固定字号绘制，缩放时字不会跟着糊成一团 */
const labels = [];

/* ---------- 确定性噪声 ---------- */
function h2(i,j,s){ const n = Math.sin(i*127.1 + j*311.7 + s*74.7)*43758.5453; return n-Math.floor(n); }
function sm(t){ return t*t*(3-2*t); }
function vn(x,y,s){
  const i=Math.floor(x), j=Math.floor(y), fx=sm(x-i), fy=sm(y-j);
  const a=h2(i,j,s), b=h2(i+1,j,s), c=h2(i,j+1,s), d=h2(i+1,j+1,s);
  return (a+(b-a)*fx) + ((c+(d-c)*fx)-(a+(b-a)*fx))*fy;
}
function fbm(x,y,s){ return vn(x,y,s)*.56 + vn(x*2.1,y*2.1,s+3)*.29 + vn(x*4.3,y*4.3,s+7)*.15; }
function rnd(s){ const n=Math.sin(s*12.9898+seed*0.017)*43758.5453; return n-Math.floor(n); }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mix(c1,c2,t){ return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]; }

/* 四档视角：全境 + 三幅分图。每档有独立的注记 LOD 阈值与题签，
   分图缩放继续生效——缩小到阈值以下，注记照样逐层收回去，不锁死。 */
const FOCUS = {
  all:      {l2:1.15,l3:2.00,title:'十三州全境',sub:'纵横不拘实距 · 州界不作考据边界'},
  zhongyuan:{l2:0.85,l3:1.30,title:'中原详图 · 官渡至许都',sub:'汉末县邑与战具按比例尺逐层显字 · 朱题在此'},
  hebei:    {l2:0.95,l3:1.45,title:'河北详图 · 邺至黎阳',sub:'坞堡、烽燧、河防按比例尺逐层显字'},
  jingyang: {l2:1.00,l3:1.50,title:'荆扬详图 · 江陵至建业',sub:'水田、陂塘、泽薮按比例尺逐层显字'},
};
/* 每幅分图的落点与倍率；返回全境即复位 */
const VIEWS = {
  all:      {zoom:1,   lon:109.50, lat:29.00},
  zhongyuan:{zoom:2.70,lon:114.15, lat:34.55},
  hebei:    {zoom:3.10,lon:115.20, lat:37.20},
  jingyang: {zoom:2.80,lon:115.80, lat:29.00},
};

/* ---------- 区域权重：南北之别是连续场，不是分区填色 ---------- */
const C_NORTH=[186,168,126], C_SOUTH=[118,148,120], C_DESERT=[214,197,160],
      C_LINGNAN=[152,170,134], C_WET=[92,126,130],
      C_SAND=[206,186,142], C_COAST=[166,178,164], C_KARST=[142,158,140];
function region(lon,lat){
  // 秦岭—淮河线随经度起伏，过渡带宽 8 度，避免硬切
  const qin = 33.2 + 0.9*Math.sin((lon-104)*0.42) + (lon<112?0.5:0)
              + (fbm(lon*1.3,lat*1.1,seed*.004)-.5)*1.4;
  const south = clamp((qin+1.4-lat)/8.0, 0, 1);
  const desert = clamp((lat-37)/7,0,1)*clamp((108-lon)/14,0,1);
  const lingnan = clamp((25-lat)/10,0,1);
  const wet = clamp(1-Math.abs(lat-30.6)/2.8,0,1)*clamp((lon-104)/9,0,1)*0.42;
  /* 三类补充地貌：全是连续场，边界随噪声起伏，不画区划框、不按格硬切。
     ① 黄河下游沙碛：建安初河道南摆后的故道沙地，官渡「依沙堆为营」一带；
     ② 海积平原：青徐扬东缘沿海滩涂与盐田，岸线随纬度与噪声摆动；
     ③ 喀斯特：零陵桂阳一线（南岭南麓）孤峰点簇，只在小片高值区出现。 */
  const sand = clamp(1-Math.abs(lat-35.35)/1.85,0,1) * clamp((lon-113.0)/2.2,0,1)
             * clamp((119.4-lon)/2.6,0,1) * (0.55+0.45*fbm(lon*2.2,lat*2.1,seed*.009));
  const coastEdge = 119.0 + 1.5*Math.sin((lat-24)*0.42) + 0.7*(fbm(lon*1.1,lat*1.3,seed*.013)-.5);
  const coast = clamp((lon-coastEdge)/2.6,0,1) * clamp((lat-22)/4,0,1) * clamp((41-lat)/3,0,1);
  const karst = Math.exp(-Math.pow((lon-111.8)/1.9,2)) * Math.exp(-Math.pow((lat-25.6)/1.55,2))
              * clamp((27.8-lat)/2.2,0,1);
  // 密度：中原与江南高，河西/塞北/岭南低；沙碛与滩涂更稀，孤峰区略密
  const core = Math.exp(-Math.pow((lat-33.5)/9,2)) * clamp((lon-100)/10,0,1);
  const density = clamp(0.20 + 0.72*core + 0.30*wet - 0.42*desert - 0.30*lingnan
                  - 0.20*sand - 0.16*coast + 0.10*karst
                  + (fbm(lon*.42,lat*.48,seed*.006)-.5)*0.5, 0.06, 1);
  // 风势：连续场决定笔向，相邻区域渐变而非全图同向
  const wind = (fbm(lon*.32,lat*.36,seed*.008)-.5)*2.4 + (south-.5)*0.5;
  return {south,desert:clamp(desert,0,1),lingnan,wet,qin,density,wind,sand,coast,karst};
}
function fieldColor(lon,lat){
  const r=region(lon,lat), n=fbm(lon*0.55, lat*0.62, seed*0.001);
  let c=mix(C_NORTH,C_SOUTH,r.south);
  c=mix(c,C_DESERT,r.desert*0.86);
  c=mix(c,C_LINGNAN,r.lingnan*0.42);
  c=mix(c,C_WET,r.wet*0.48);
  c=mix(c,C_SAND,r.sand*0.68);
  c=mix(c,C_COAST,r.coast*0.55);
  c=mix(c,C_KARST,r.karst*0.42);
  const d=(n-0.5)*38;
  return [clamp(c[0]+d,0,255),clamp(c[1]+d,0,255),clamp(c[2]+d*0.8,0,255), r];
}

/* ---------- 变宽多边形笔：根部聚一点、起粗收尖，一次 fill ----------
   hook=true 时补工笔双勾：沿左右缘各描一线，内侧留一道纸白「水线」。
   不是给笔加框——缘是笔自己的边界，随提按收尖，中间那道白是染与线之间的留隙。 */
function brush(g, pts, w0, w1, color, alpha, hook){
  if(pts.length<2) return;
  const L=[], R=[], LI=[];
  for(let k=0;k<pts.length;k++){
    const p=pts[k], a=pts[Math.max(0,k-1)], b=pts[Math.min(pts.length-1,k+1)];
    let dx=b[0]-a[0], dy=b[1]-a[1]; const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    const t=k/(pts.length-1);
    const w=(lerp(w0,w1,t)) * (0.72+0.42*Math.sin(t*Math.PI));
    L.push([p[0]-dy*w, p[1]+dx*w]);
    R.push([p[0]+dy*w, p[1]-dx*w]);
    const inset=Math.min(1.15, w*.58);
    LI.push([p[0]-dy*(w-inset), p[1]+dx*(w-inset)]);
  }
  const prev=g.globalAlpha;
  g.beginPath(); g.moveTo(L[0][0],L[0][1]);
  for(let k=1;k<L.length;k++) g.lineTo(L[k][0],L[k][1]);
  for(let k=R.length-1;k>=0;k--) g.lineTo(R[k][0],R[k][1]);
  g.closePath(); g.globalAlpha=prev*alpha; g.fillStyle=color; g.fill(); g.globalAlpha=prev;
  if(hook){
    g.save();
    const stroke=(arr,col,lw,a)=>{
      g.beginPath(); g.moveTo(arr[0][0],arr[0][1]);
      for(let k=1;k<arr.length;k++) g.lineTo(arr[k][0],arr[k][1]);
      g.strokeStyle=col; g.lineWidth=lw; g.globalAlpha=a; g.stroke();
    };
    stroke(L,'rgba(36,48,38,.32)',.65,1);
    stroke(R,'rgba(36,48,38,.24)',.60,1);
    stroke(LI,'rgba(236,228,206,.52)',.80,1);   // 水线：留一线纸白
    g.restore();
  }
}
function line(g,pts,color,width,alpha,dash){
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let k=1;k<pts.length;k++) g.lineTo(pts[k][0],pts[k][1]);
  g.strokeStyle=color; g.lineWidth=width; g.globalAlpha=alpha===undefined?1:alpha;
  if(dash) g.setLineDash(dash); else g.setLineDash([]);
  g.stroke(); g.setLineDash([]); g.globalAlpha=1;
}
function P(arr){
  if(typeof arr[0]==='number') return [lon2x(arr[0]),lat2y(arr[1])];  // 单点锚点
  return arr.map(([l,t])=>[lon2x(l),lat2y(t)]);
}

/* 不规则闭合笔路：取代 ellipse / rect。半径由低频噪声连续给出，一次运笔闭合。 */
function irregular(g,cx,cy,rx,ry,key,fill,stroke,lw){
  const N=26, pts=[];
  for(let k=0;k<N;k++){
    const a=k/N*Math.PI*2;
    // 形变幅度给足：放大后读成一团不规则墨迹，不是标准椭圆。
    const wob=1 + (fbm(Math.cos(a)*1.7+key*3.1, Math.sin(a)*1.7+key*2.3, seed*.005)-.5)*.86
                 + (rnd(key*13+k*2.7)-.5)*.34;
    const sq=1+(fbm(Math.cos(a)*2.9+key*5.3, Math.sin(a)*2.9+key*4.1, seed*.009)-.5)*.30;
    pts.push([cx+Math.cos(a)*rx*wob*sq, cy+Math.sin(a)*ry*wob/sq]);
  }
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let k=1;k<N;k++) g.lineTo(pts[k][0],pts[k][1]);
  g.closePath();
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=lw||1; g.stroke(); }
  return pts;
}
/* 竖排题名：逐字落笔，带纸白描边，密背景上仍读得出 */
function vlabel(g,txt,x,y,size,color,halo,step){
  g.textAlign='center'; g.textBaseline='middle'; g.font=`${size}px serif`;
  g.lineWidth=2.6; g.strokeStyle=halo||'rgba(236,228,206,.80)';
  const d=step||size+2;
  for(let i=0;i<txt.length;i++){
    const yy=y+i*d;
    g.strokeText(txt[i],x,yy); g.fillStyle=color; g.fillText(txt[i],x,yy);
  }
  g.textBaseline='alphabetic';
}
/* 一级朱题：朱点随图走，文字与纸衬交给屏幕注记层（缩放时不被拉大） */
let sealOn = true;   // 只在全境 / 中原分图落朱，河北荆扬不串朱色
function sealLabel(g,txt,x,y,area){
  if(sealOn) irregular(g,x,y-2,2.3,2.3,x*.1+y*.07+1,'rgba(166,49,41,.78)',null,0);
  // 朱题位置被引笔抬高，按注记坐标反算经纬度会误判区域；这里直接给区域
  labels.push({mx:x,my:y,txt,level:1,kind:'seal',area:area||'zhongyuan'});
}
/* 二级墨注：有个性但不抢，随比例尺第二档出现 */
function inkNote(g,txt,x,y){
  labels.push({mx:x,my:y,txt,level:2,kind:'ink'});
}
/* 注记分级绘制：屏幕固定字号，只按档微调字级；位置随图变换 */
function drawLabels(){
  const k=clamp(0.90+0.10*zoom,0.90,1.18);
  const V=FOCUS[focus], L2=zoom>=V.l2, L3=zoom>=V.l3;
  const sc=(mx,my)=>[W/2+panX+(mx-W/2)*zoom, H/2+panY+(my-H/2)*zoom];
  const prio={seal:0,capital:1,state:2,cmd:3,ink:3,county:4};
  const placed=[];
  // 先按重要性落字；包围盒相交的下级注记自动跳过 —— 密处少显，疏处多显
  for(const L of [...labels].sort((a,b)=>(prio[a.kind]??9)-(prio[b.kind]??9))){
    if(L.level>=2 && !L2) continue;
    if(L.level>=3 && !L3) continue;
    // 朱题只在全境与中原出现：河北/荆扬分图不串朱色
    if(focus!=='all' && L.kind==='seal' && !(focus==='zhongyuan' && L.area==='zhongyuan')) continue;
    const [sx,sy]=sc(L.mx,L.my);
    if(sx<-90||sx>W+90||sy<-90||sy>H+90) continue;
    const fs = L.kind==='seal'?15*k : L.kind==='capital'?12*k : L.kind==='state'?11*k
             : L.kind==='cmd'?10*k : L.kind==='county'?9*k : 10*k;
    const vert = L.kind==='seal'||L.kind==='capital';
    const bw = vert ? fs*1.55 : L.txt.length*fs*.98;
    const bh = vert ? L.txt.length*(fs+2)*1.05 : fs*1.40;
    const cy = L.kind==='seal' ? sy+12*k+(L.txt.length-1)*(15*k+2)/2
             : vert ? sy+(L.txt.length-1)*(fs+2)/2 : sy;
    const box=[sx-bw/2,cy-bh/2,sx+bw/2,cy+bh/2];
    if(placed.some(q=>box[0]<q[2]&&box[2]>q[0]&&box[1]<q[3]&&box[3]>q[1])) continue;
    placed.push(box);
    if(L.kind==='seal'){
      const n=L.txt.length, s=15*k, step=s+2, y0=sy+12*k, cy=y0+(n-1)*step/2;
      irregular(ctx,sx,cy,10*k,n*9*k+7,sx*.1+sy*.07,'rgba(233,227,209,.80)',null,0);
      vlabel(ctx,L.txt,sx,y0,s,'rgba(116,38,30,.95)','rgba(236,228,206,.92)',step);
    } else if(L.kind==='capital'){
      vlabel(ctx,L.txt,sx,sy,12*k,'rgba(38,32,24,.94)','rgba(236,228,206,.90)',12*k+2);
    } else if(L.kind==='state'){
      ctx.font=`${11*k}px serif`; ctx.textAlign='left'; ctx.lineWidth=2.4;
      ctx.strokeStyle='rgba(236,228,206,.75)'; ctx.strokeText(L.txt,sx,sy);
      ctx.fillStyle='rgba(140,58,44,.72)'; ctx.fillText(L.txt,sx,sy);
    } else if(L.kind==='cmd'){
      ctx.font=`${10*k}px serif`; ctx.textAlign='center'; ctx.lineWidth=2;
      ctx.strokeStyle='rgba(236,228,206,.65)'; ctx.strokeText(L.txt,sx,sy);
      ctx.fillStyle='rgba(52,44,32,.76)'; ctx.fillText(L.txt,sx,sy);
    } else if(L.kind==='county'){
      ctx.font=`${9*k}px serif`; ctx.textAlign='center'; ctx.lineWidth=1.8;
      ctx.strokeStyle='rgba(236,228,206,.58)'; ctx.strokeText(L.txt,sx,sy);
      ctx.fillStyle='rgba(72,62,46,.62)'; ctx.fillText(L.txt,sx,sy);
    } else { // ink
      ctx.font=`${10*k}px serif`; ctx.textAlign='left'; ctx.lineWidth=2.2;
      ctx.strokeStyle='rgba(236,228,206,.86)'; ctx.strokeText(L.txt,sx,sy);
      ctx.fillStyle='rgba(64,52,38,.86)'; ctx.fillText(L.txt,sx,sy);
    }
  }
  if(focus!=='all'){
    ctx.font='bold 16px serif'; ctx.textAlign='left'; ctx.lineWidth=3.2;
    ctx.strokeStyle='rgba(236,228,206,.92)'; ctx.strokeText(V.title,22,32);
    ctx.fillStyle='rgba(40,34,26,.92)'; ctx.fillText(V.title,22,32);
    ctx.font='11px serif'; ctx.lineWidth=2.4; ctx.strokeStyle='rgba(236,228,206,.88)';
    ctx.strokeText(V.sub,22,50);
    ctx.fillStyle='rgba(64,52,38,.88)'; ctx.fillText(V.sub,22,50);
  }
  return (focus==='all'?'':V.title.split(' · ')[0]+' ') + (L3?'注记 L3 县邑':L2?'注记 L2 郡治':'注记 L1 州治');
}
/* 注记引笔：极淡，只在远处主景用，不喧宾夺主 */
function lead(g,from,tx,ty){
  brush(g,[[from[0],from[1]],[(from[0]+tx)/2+3,(from[1]+ty)/2-2],[tx,ty+2]],
        .45,.1,'rgb(150,52,42)',.22);
}
/* 手刻印形：方形但边缘抖动，不是纯 rect（汉印本方，取刻石缺损感） */
function sealBox(g,h,fill,stroke){
  const p=[[-h,-h],[h,-h],[h,h],[-h,h]], pts=[];
  for(let k=0;k<4;k++){
    const a=p[k], b=p[(k+1)%4];
    for(let q=0;q<4;q++){
      const t=q/4;
      pts.push([lerp(a[0],b[0],t)+(rnd(k*13+q*7+h)-.5)*1.8,
                lerp(a[1],b[1],t)+(rnd(k*17+q*3+h)-.5)*1.8]);
    }
  }
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let k=1;k<pts.length;k++) g.lineTo(pts[k][0],pts[k][1]);
  g.closePath();
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=1.3; g.stroke(); }
}

/* ---------- 背景层：连续底罩 + 一次性扫描游走笔触 ----------
   zb = 笔触密度倍率。大局部时按倍率重渲：笔在逻辑坐标里更密更细（除以 zb），
   离屏图超采样 S 倍保证清晰；合成后屏幕笔宽 ≈ 原尺寸，不会被拉成鱼鳞斜纹。 */
function makeBg(zb){
  zb = zb||1;
  const S = clamp(Math.ceil(zb),1,3);
  const c=document.createElement('canvas'); c.width=W*S; c.height=H*S;
  const g=c.getContext('2d');
  g.scale(S,S);
  // 纸底
  g.fillStyle='#e9e3d1'; g.fillRect(0,0,W,H);
  // 连续场底罩：低分辨率生成后平滑放大，无台阶
  const FW=350*S, FH=275*S, im=g.createImageData(FW,FH);
  for(let j=0;j<FH;j++) for(let i=0;i<FW;i++){
    const lon=LON0+i/FW*(LON1-LON0), lat=LAT1-j/FH*(LAT1-LAT0);
    const [r,gg,b,reg]=fieldColor(lon,lat);
    const k=(j*FW+i)*4;
    im.data[k]=r; im.data[k+1]=gg; im.data[k+2]=b;
    // 底罩不铺满：密度越低纸透得越多，边地留一丢丢白
    im.data[k+3]=Math.round(255*clamp(0.56+0.44*reg.density,0,1));
  }
  const fc=document.createElement('canvas'); fc.width=FW; fc.height=FH;
  fc.getContext('2d').putImageData(im,0,0);
  g.drawImage(fc,0,0,W,H);

  // 图廓：手绘抖笔双线，不用 rect
  function border(inset,wid,col,lw){
    const pts=[];
    const push=(x,y)=>pts.push([x+(rnd(x*.07+y*.13)-.5)*1.8, y+(rnd(x*.11+y*.05)-.5)*1.8]);
    for(let x=inset;x<=W-inset;x+=42) push(x,inset);
    for(let y=inset;y<=H-inset;y+=38) push(W-inset,y);
    for(let x=W-inset;x>=inset;x-=42) push(x,H-inset);
    for(let y=H-inset;y>=inset;y-=38) push(inset,y);
    line(g,pts,col,lw,.7);
  }
  border(14,2,'rgba(120,92,52,.52)',2.0);
  border(21,1,'rgba(120,92,52,.26)',1.0);

  // 泽：不填青色片。只靠断续岸笔 + 顺流水纹 + 芦苇丛把水从纸里读出来。
  // 底罩的湿场已给水域偏青，这里只给笔，不给色块。
  MARSHES.forEach((m,mi)=>{
    const cx=lon2x(m.l), cy=lat2y(m.t), rx=lon2x(m.l+m.rx)-cx, ry=lat2y(m.t)-lat2y(m.t+m.ry);
    const kM=1/zb, N=26;
    const edge=irregular(g,cx,cy,rx,ry,mi+7,null,null,0);   // 只取点列，不画
    // 岸线：每隔几段落一笔，笔断意连，不围成闭合圈
    for(let k=0;k<N;k+=2){
      if(rnd(mi*37+k*5.1)>.72) continue;
      brush(g,[edge[k],edge[(k+1)%N],edge[(k+2)%N]],
            .9*kM,.22*kM,'rgba(52,94,100,.44)',.55);
    }
    // 水纹：沿几条平行弧带，断续短横笔，行距随倍率缩小
    const rows=Math.max(3,Math.round(4/kM));
    for(let row=0;row<rows;row++){
      const f=(row+1)/(rows+1), yy=cy+(f-.5)*2*ry*.86;
      const half=rx*.88*Math.sqrt(Math.max(0,1-((f-.5)*1.72)**2));
      const cnt=Math.max(2,Math.round(half/(6*kM)));
      for(let q=0;q<cnt;q++){
        if(rnd(mi*53+row*11+q*3.7)>.58) continue;
        const x=cx-half+2*half*(q+.5)/cnt;
        const w=(2.2+rnd(mi*7+row*13+q)*3)*kM;
        brush(g,[[x-w,yy],[x,yy-.7*kM],[x+w,yy+.3*kM]],
              .7*kM,.18*kM,'rgba(56,104,110,.40)',.46);
      }
    }
    // 芦苇：贴岸成丛，长度/朝向各自独立
    const cnt=Math.round((24+m.rx*30)/kM);
    for(let k=0;k<cnt;k++){
      const a=rnd(k*3.1+m.l)*Math.PI*2, rr=0.66+0.32*rnd(k*5.7+m.t);
      const x=cx+Math.cos(a)*rx*rr, y=cy+Math.sin(a)*ry*rr;
      const L=(3+rnd(k*9.3+m.t)*4)*kM;
      brush(g,[[x,y],[x+.6*kM,y-L*.6],[x+1.6*kM,y-L]],
            .8*kM,.16*kM,'rgba(58,96,80,.52)',.5);
    }
    // 沙洲：几笔浅色短横，不是白椭圆
    for(let k=0;k<Math.round(3/kM);k++){
      const x=cx+(rnd(k*7.3+m.l)-.5)*rx*1.0, y=cy+(rnd(k*9.1+m.t)-.5)*ry*.9;
      const w=(3+rnd(k*11.7)*3)*kM;
      brush(g,[[x-w,y],[x,y-.6*kM],[x+w,y+.2*kM]],
            .9*kM,.3*kM,'rgba(226,212,174,.62)',.6);
    }
  });

  // 河：双勾岸 + 淡青罩 + 顺流波纹（断续，笔断意连）
  RIVERS.forEach((rv,idx)=>{
    const p=P(rv.p);
    line(g,p,'rgba(66,88,86,.38)',rv.w+2.6,.30);
    line(g,p,'rgba(190,202,192,.26)',rv.w*.86,.40);   // 原 .50 纸白芯偏亮，压到淡青灰
    line(g,p,'rgba(74,108,110,.54)',rv.w*.42,.58);
    for(let k=0;k<p.length-1;k++){
      const a=p[k], b=p[k+1], seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const n=Math.max(2,Math.round(seg/26));
      for(let q=0;q<n;q++){
        if(rnd(idx*91+k*13+q*2.7)<.34) continue;
        const t=(q+.5)/n, x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
        brush(g,[[x-6,y+1],[x-1,y],[x+5,y-1]],.8,.12,'rgba(60,110,118,.6)',.55);
      }
    }
  });

  // 山脉不画「山」：航拍俯视只看得见林，山势靠冠层沿脊转向被读出来。
  // 脊线是断续短笔（笔断意连），顺坡皴随倍率缩小加密，不出现灰带、三角或栅栏。
  const kR=1/zb;
  RIDGES.forEach((rg,idx)=>{
    const p=P(rg.p);
    for(let k=0;k<p.length-1;k++){
      const a=p[k], b=p[k+1], seg=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
      // 脊：沿段按弧长散点短笔，长度/角度各自独立
      const nn=Math.max(2,Math.round(seg/(9*kR)));
      for(let q=0;q<nn;q++){
        if(rnd(idx*41+k*13+q*3.7)>.62) continue;
        const t=(q+.5)/nn, x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
        const L=(4+rnd(idx*7+q)*5)*kR*rg.a;
        brush(g,[[x-L,y+L*.2],[x,y-L*.35],[x+L*.8,y+L*.2]],
              .8*kR,.2*kR,'rgba(64,80,62,.42)',.48);
      }
      // 顺坡皴：方向随脊线法向，长度随起伏，随倍率缩小加密
      const n=Math.max(2,Math.round(seg/(11*kR)));
      for(let q=0;q<n;q++){
        const t=(q+.5)/n, x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
        const side=(rnd(idx*19+k*5+q)<.5?1:-1);
        const len=(7+7*rnd(idx*33+k*7+q))*rg.a*kR;
        brush(g,[[x,y],[x+1.6*side*kR,y+len*.5],[x+3.4*side*kR,y+len]],
              1.0*kR,.2*kR,'rgba(66,78,60,.44)',.46);
      }
    }
  });

  // 地表笔触：不等距扫描游走，笔型 / 密度 / 方向全由连续场决定
  // k = 1/zb：逻辑坐标里笔更小更密，合成时 ×zoom 放大回屏幕原尺寸 —— 放大不会把笔拉粗
  const k=1/zb;
  let y=8, ri=0;
  while(y<H-8){
    let x=-18+rnd(y*.37)*32;
    while(x<W+18){
      const lon=x2lon(x), lat=y2lat(y), [,, ,r]=fieldColor(lon,lat);
      const n=fbm(lon*1.7,lat*1.9,seed*.002);
      const dens=r.density;
      const step=(lerp(26,8,dens)+rnd(x*.13+y*.07)*8)*k;
      // 边地留白：密度越低越常跳笔，白从笔缝里连续漏出
      if(rnd(x*.031+y*.017) > 0.30+0.68*dens){ x+=step*.7; continue; }
      // 方向不只跟随低频风场：叠两项高频扰动，避免整片区域同向排成斜纹布。
      const ang=r.wind+(n-.5)*1.05+(rnd(x*.019+y*.023)-.5)*1.5
               +(rnd(x*.41+y*.37)-.5)*1.25,
            ca=Math.cos(ang), sa=Math.sin(ang);
      const rot=(dx,dy)=>[x+dx*ca*k-dy*sa*k, y+dx*sa*k+dy*ca*k];
      // 针叶 / 灌丛各有自己的方向策略，不共用同一个风向角
      const rotA=(dx,dy,a)=>{const c=Math.cos(a),s=Math.sin(a);
        return [x+dx*c*k-dy*s*k, y+dx*s*k+dy*c*k];};
      // 笔型按场权重概率混合：过渡带里两套笔交错，不出现硬切线
      const pick=rnd(x*.053+y*.021+n*3.1);
      const wDesert=r.desert*0.86, wLing=r.lingnan*0.60, wSouth=r.south*0.92;
      /* 三类补充地貌各用独立概率，不挤占原有南北笔法的权重：
         全境默认只在它们各自的连续高值区换笔，其余区域笔法一字不变。 */
      const terrainKind = r.sand>0.22 && rnd(x*.091+y*.043)<r.sand*0.86 ? 'sand'
                        : r.coast>0.22 && rnd(x*.077+y*.061)<r.coast*0.82 ? 'coast'
                        : r.karst>0.22 && rnd(x*.113+y*.037)<r.karst*0.84 ? 'karst' : null;
      if(terrainKind==='sand'){
        // 黄河故道沙碛：极稀的平顶短弧，露出干赭土，不连成沙带
        if(n>.36) brush(g,[rot(-8,0),rot(-2,-1.2),rot(5,-1.4),rot(9,.5)],
                        .85*k,.13*k,'rgba(168,138,92,.46)',.44);
        if(n>.78) brush(g,[rot(-4,3),rot(2,2.4)],.6*k,.1*k,'rgba(196,170,124,.40)',.38);
      } else if(terrainKind==='coast'){
        // 海积平原：平缓偏青灰的盐田短笔，时有缺笔，不闭合成格
        if(n>.30) brush(g,[rot(-7,1),rot(-1,-.4),rot(6,1.2)],
                        .7*k,.12*k,'rgba(96,132,128,.44)',.42);
        if(n>.72) brush(g,[rot(-3,4),rot(4,3.4)],.6*k,.1*k,'rgba(186,196,182,.42)',.36);
      } else if(terrainKind==='karst'){
        // 喀斯特：孤峰点簇，两三笔一组、彼此不成片（不是三角阵列）
        if(n>.28){
          const L=3+rnd(x*.37)*3;
          brush(g,[rot(-L,2),rot(-L*.35,-3.4),rot(L*.4,2)],
                .95*k,.18*k,'rgba(70,96,80,.52)',.50);
          if(n>.62) brush(g,[rot(L*.5+1,2),rot(L*.5+2,-2.2),rot(L*.5+3,1.6)],
                          .7*k,.12*k,'rgba(84,108,88,.44)',.42);
        }
      } else if(pick < wDesert || (lat>40.5 && n>.55)){
        // 沙碛 / 塞北：极稀的横向短弧，笔数最少
        if(n>.34) brush(g,[rot(-9,0),rot(0,-2),rot(10,1)],.9*k,.12*k,'rgba(150,126,88,.40)',.42);
      } else if(pick < wDesert+wLing){
        // 岭南：疏笔，不铺满；不用圆点（圆是几何图元）
        if(n>.46){
          const s=1.6+rnd(x*.7)*1.8;
          brush(g,[rot(-s,0),rot(0,-1),rot(s,.6)],.9*k,.3*k,'rgba(88,110,80,.40)',.46);
        }
      } else if(pick < wDesert+wLing+wSouth){
        // 南方：田块只在低频高值区成簇，且随风向倾斜、时有缺笔
        const cluster=fbm(lon*.72,lat*.83,seed*.011);
        if(cluster>.44 && rnd(x*.33+y*.19)>.20){
          // 田埂只是一组平行短笔，缺笔、倾斜、绝不闭合成方框
          const s=3+rnd(x*.21)*5, rows=3+Math.floor(rnd(x*.41)*2);
          for(let i=0;i<rows;i++){
            if(rnd(x*.53+i*7.1)>.22) continue;
            const dy=i*2.4-s*.6;
            brush(g,[rot(-s*.9,dy),rot(0,dy-.4),rot(s*.8,dy+.3)],.62*k,.1*k,'rgba(64,104,80,.46)',.46);
          }
        } else {
          brush(g,[rot(-3,3),rot(0,-3),rot(4,2)],1.2*k,.14*k,'rgba(46,88,68,.52)',.48);
        }
      } else {
        // 北方：笔型由冠层连续场给，不再全是一模一样的横向燥笔束。
        // 笔型单一时 ×4 放大只会读成一层同向短弧纹样 —— 那是平铺换了张皮。
        const canopy = clamp(0.18 + 0.58*r.density + 0.22*r.south + 0.16*r.wet
                             - 0.30*r.desert - 0.18*r.sand - 0.14*r.coast
                             + (n-.5)*.24, 0, 1);
        const wNeedle = clamp((canopy-.48)/.42,0,1)*.70;
        const wShrub  = clamp((.48-canopy)/.34,0,1)*.62;
        const L=5+rnd(x*.19)*6;
        const c = n>.55 ? 'rgba(56,76,62,.58)' : 'rgba(126,100,64,.50)';
        const p = rnd(x*.041+y*.029+n*5.7);
        if(p < wNeedle){
          // 针叶：放射状，每根自取一角，不沿统一风向
          for(let t=0;t<3;t++){
            const aa=ang+(t-1)*(.42+rnd(x*.31+t)*.34)+(rnd(x*.57+t*9)-.5)*.9;
            brush(g,[rotA(-L*.15,0,aa),rotA(0,-1,aa),rotA(L*.85,-.5,aa)],1.05*k,.10*k,c,.50);
          }
        } else if(p < wNeedle+wShrub){
          // 灌丛：横走偏角，三四笔错开，方向各自偏一点
          const ba=ang+1.15+(rnd(x*.29+y*.13)-.5)*1.1;
          for(let t=0;t<3;t++){
            const d=t*2.1-2.1, l=L*(.55+rnd(x*.23+t*5)*.35);
            brush(g,[rotA(-l,d,ba),rotA(0,d-.6,ba),rotA(l*.9,d+.3,ba)],1.25*k,.12*k,c,.50);
          }
        } else {
          // 阔叶 / 荒田：短粗一主一副，仍保持战后稀疏断续
          const dy=Math.sin(ang)*2;
          brush(g,[rot(-L,dy),rot(0,dy-1.4),rot(L*.82,dy+.5)],1.6*k,.12*k,c,.52);
          if(n>.72) brush(g,[rot(-2,3),rot(0,0),rot(3,-3)],1.0*k,.1*k,'rgba(50,70,56,.5)',.44);
        }
      }
      x+=step;
    }
    y += (9+rnd(ri*7.3)*8)*k; ri++;
  }
  return c;
}

/* ---------- 地物层 ---------- */
function makeFg(f){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  labels.length=0;
  sealOn = (f==='all' || f==='zhongyuan');

  // 势力层不画：归属随玩家局内动态变化，由上层逻辑负责，背景只给地与物。

  // 州界朱线（示意）
  STATES.forEach((s,si)=>{
    const p=P(s.p);
    // 沿折线按弧长抖点断续落笔，首尾不闭合：读成朱线，不是多边形
    for(let k=0;k<p.length-1;k++){
      const a=p[k], b=p[k+1], seg=Math.hypot(b[0]-a[0],b[1]-a[1])||1;
      let t=0.02;
      while(t<0.97){
        const t2=Math.min(0.97,t+(7+rnd(si*17+k*5+t*73)*10)/seg);
        if(rnd(si*29+k*11+t*151)>.44){
          const j=q=>[lerp(a[0],b[0],q)+(rnd(q*97+si)-.5)*3.6,
                      lerp(a[1],b[1],q)+(rnd(q*83+si*3)-.5)*3.6];
          brush(g,[j(t),j((t+t2)/2),j(t2)],.68,.15,'rgb(150,52,42)',.22);
        }
        t=t2;
      }
    }
    const c=p[0];
    labels.push({mx:c[0]+5,my:c[1]+14,txt:s.n,level:2,kind:'state'});
  });

  // 长城三重 + 沿线烽燧
  WALLS.forEach((w,idx)=>{
    const p=P(w.p);
    line(g,p,'rgba(84,68,48,.75)',w.w+1.6,.7);
    line(g,p,'rgba(214,198,160,.62)',w.w*.5,.55,[9,5]);
    for(let k=0;k<p.length-1;k++){
      const a=p[k],b=p[k+1],seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
      let t=0.02+rnd(k*3.7+idx)*0.05;
      while(t<0.98){
        if(idx<=1 && rnd(k*11.3+t*97+idx)>.44){
          const x=lerp(a[0],b[0],t)+(rnd(t*211)-.5)*4;
          const y=lerp(a[1],b[1],t)+(rnd(t*173)-.5)*4;
          beacon(g,x,y,idx,rnd(t*311));
        }
        t += (46+rnd(k*7.1+t*131)*52)/seg;   // 不等距，不再像等距图章
      }
    }
  });

  /* ========== 主景：史料点名、俯视有辨识度，各自单独画，不复制图章 ==========
     重点由朱色竖题 + 字级 + 引笔点明，不靠画框。势力一概不画。 */

  // ① 官渡（一级主景）：依沙塠为屯，东西数十里；土山高橹、霹雳车、地道—长堑
  const gd=P(LANDMARKS.guandu), gx=gd[0], gy=gd[1];
  const span=62, war=[];
  for(let k=0;k<=18;k++) war.push([gx-span+2*span*k/18, gy-15+(rnd(k*2.7)-.5)*5]);
  for(let k=0;k<war.length-1;k+=2)
    brush(g,[war[k],war[k+1],war[Math.min(k+2,war.length-1)]],1.7,.3,'rgb(122,86,52)',.72);  // 袁营深沟
  for(let k=0;k<=18;k++) war[k]=[war[k][0], war[k][1]+30+(rnd(k*4.3)-.5)*4];
  for(let k=0;k<war.length-1;k+=2)
    brush(g,[war[k],war[k+1],war[Math.min(k+2,war.length-1)]],1.5,.25,'rgb(46,78,62)',.70);  // 曹营长堑
  // 营垒：断续弧笔，不等距、大小不一、缺口各异 —— 不是一串闭合圆泡泡
  function campArc(g,x,y,rx,ry,key,color){
    const N=13, st=Math.floor(rnd(key)*5), ln=7+Math.floor(rnd(key*3)*5), pts=[];
    for(let q=0;q<ln;q++){
      const a=(st+q)/N*Math.PI*2;
      pts.push([x+Math.cos(a)*rx*(1+(rnd(key+q)-.5)*.24),
                y+Math.sin(a)*ry*(1+(rnd(key*7+q)-.5)*.30)]);
    }
    brush(g,pts,1.25,.55,color,.72);
  }
  for(let k=0;k<9;k++){
    const x=gx-58+k*14+(rnd(k*5.9)-.5)*9, y=gy-22+(rnd(k*3.1)-.5)*6;
    campArc(g,x,y,3+rnd(k*7)*2.6,2.2+rnd(k*11)*1.6,k+41,'rgb(150,110,62)');
    if(k%3!==1) campArc(g,x+2,y+31,2.6+rnd(k*13)*2,2+rnd(k*17)*1.4,k+83,'rgb(46,78,62)');
  }
  for(let k=0;k<18;k++){                                  // 沙堆：断续短弧笔
    const x=gx-60+rnd(k*7.7)*120, y=gy-8+rnd(k*3.9)*7;
    brush(g,[[x-7,y],[x,y-3],[x+8,y]],1.5,.2,'rgb(176,142,94)',.62);
  }
  // 霹雳车（发石车）：不规则木架 + 石堆，曹营侧
  const pcx=gx-16, pcy=gy+20;
  brush(g,[[pcx-7,pcy+4],[pcx,pcy-6],[pcx+7,pcy+3]],1.6,.3,'rgb(74,60,42)',.85);
  brush(g,[[pcx-6,pcy+3],[pcx+1,pcy-1],[pcx+7,pcy+4]],1.1,.2,'rgb(74,60,42)',.7);
  for(let q=0;q<5;q++) irregular(g,pcx+12+(rnd(q*3)*9),pcy+2+(rnd(q*7)*6),
      1.2+rnd(q*11),1+q%2,200+q,'rgb(96,90,76)',null,0);
  // 土山高橹：袁营侧不规则台 + 竖橹
  irregular(g,gx+22,gy-26,7,4,311,'rgba(150,118,74,.62)','rgb(110,84,52)',1);
  brush(g,[[gx+22,gy-29],[gx+23,gy-38],[gx+22,gy-44]],1.3,.3,'rgb(74,60,42)',.85);
  // 地道—长堑：两道平行浅笔
  brush(g,[[gx-34,gy+1],[gx-10,gy+2],[gx+12,gy+1]],1.1,.2,'rgb(92,76,56)',.55);
  brush(g,[[gx-32,gy+6],[gx-9,gy+7],[gx+14,gy+6]],.9,.15,'rgb(46,78,62)',.5);
  sealLabel(g,'官渡',gx-2,gy-56,'zhongyuan');

  // ② 雒阳城南灵台 / 明堂 / 辟雍：夯土高台，太史令候望之所
  const lt=P(LANDMARKS.lingtai);
  irregular(g,lt[0],lt[1],7,5.2,401,'rgba(158,138,102,.72)','rgb(96,80,56)',1.1);
  irregular(g,lt[0],lt[1],3.6,2.6,402,'rgba(214,196,158,.72)',null,0);
  for(let q=0;q<9;q++){
    const a=q/9*Math.PI*2, x=lt[0]+Math.cos(a)*11, y=lt[1]+Math.sin(a)*8;
    brush(g,[[x,y+2],[x,y-2],[x+.6,y-5]],1,.15,'rgb(52,76,58)',.62);
  }
  lead(g,lt,lt[0]-36,lt[1]-38); sealLabel(g,'灵台',lt[0]-36,lt[1]-38,'zhongyuan');

  // ③ 邙山东汉圆丘封土：由覆斗改圆丘，高不足二十米、径七十至百三十米，环植柏
  const ms=P(LANDMARKS.mangshan);
  for(let q=0;q<4;q++){
    const x=ms[0]+(q-1.5)*13, y=ms[1]+(rnd(q*3.7)-.5)*5;
    irregular(g,x,y,4.6+rnd(q*5)*2,3.2+rnd(q*7)*1.4,410+q,'rgba(168,146,106,.68)','rgb(104,86,60)',1);
    for(let t=0;t<7;t++){
      const a=t/7*Math.PI*2;
      brush(g,[[x+Math.cos(a)*7,y+Math.sin(a)*5+1],[x+Math.cos(a)*7,y+Math.sin(a)*5-2],
               [x+Math.cos(a)*7+.5,y+Math.sin(a)*5-5]],.8,.12,'rgb(48,72,54)',.55);
    }
  }
  lead(g,ms,ms[0]+32,ms[1]-30); inkNote(g,'邙陵',ms[0]+32,ms[1]-30);

  // ④ 阳城汉三阙（太室 / 少室 / 启母，东汉延光年间）：一对石垛，中留阙道
  const hq=P(LANDMARKS.hanque);
  irregular(g,hq[0]-6,hq[1],2.4,5.4,421,'rgba(146,136,116,.82)','rgb(78,70,56)',1);
  irregular(g,hq[0]+6,hq[1],2.2,5.0,422,'rgba(146,136,116,.82)','rgb(78,70,56)',1);
  brush(g,[[hq[0]-4,hq[1]+6],[hq[0],hq[1]+7],[hq[0]+4,hq[1]+6]],.8,.15,'rgb(120,104,78)',.6);
  lead(g,hq,hq[0]+26,hq[1]+18); inkNote(g,'汉阙',hq[0]+26,hq[1]+18);

  // ⑤ 轘辕关十二曲：山道折返十二次，一次性笔路
  const hy=P(LANDMARKS.huanyuan); const road=[];
  for(let k=0;k<=12;k++) road.push([hy[0]-16+k*2.7, hy[1]-12+k*1.9+(k%2?4:-4)]);
  brush(g,road,1.5,.25,'rgb(88,74,54)',.72);
  irregular(g,hy[0]+18,hy[1]+10,3.4,2.6,431,'rgba(150,120,82,.7)','rgb(84,68,48)',1);
  lead(g,[hy[0]-14,hy[1]-10],hy[0]-32,hy[1]+16); inkNote(g,'轘辕',hy[0]-32,hy[1]+16);

  // ⑥ 圃田泽二十四浦：由泽心分汊的一次性短笔，长短不一
  const pt=P(LANDMARKS.putian);
  for(let k=0;k<16;k++){
    const a=k/16*Math.PI*2+rnd(k*3.3)*.3, len=8+rnd(k*7.1)*14;
    brush(g,[[pt[0]+Math.cos(a)*3,pt[1]+Math.sin(a)*2],
             [pt[0]+Math.cos(a)*len*.55,pt[1]+Math.sin(a)*len*.4],
             [pt[0]+Math.cos(a)*len,pt[1]+Math.sin(a)*len*.7]],.8,.1,'rgb(56,100,104)',.46);
  }
  inkNote(g,'二十四浦',pt[0]+22,pt[1]+22);

  // ⑦ 黄河金堤 / 十里一水门：断续夯土线 + 不等距斗门（不画成闸门阵列）
  const jd=P(LANDMARKS.jindi);
  const dike=[]; for(let k=0;k<=10;k++) dike.push([jd[0]-30+k*6, jd[1]+Math.sin(k*.9)*3]);
  for(let k=0;k<dike.length-1;k+=2)
    brush(g,[dike[k],dike[k+1],dike[Math.min(k+2,dike.length-1)]],1.3,.25,'rgb(146,118,78)',.62);
  [2,6,9].forEach((k,qi)=>{
    const x=dike[k][0], y=dike[k][1];
    irregular(g,x,y,2+qi*.5,2.6+qi*.4,440+qi,'rgba(214,198,160,.8)','rgb(96,78,54)',1);
    brush(g,[[x,y+3],[x+1,y+7],[x,y+9]],.7,.15,'rgb(74,60,42)',.6);
  });
  inkNote(g,'金堤',jd[0]-52,jd[1]-14);

  // ⑧ 枣祗河 / 任峻「铜底铁帮运粮河」：带名字的渠 + 陡门
  const yl=P(LANDMARKS.yunliang);
  const canal=[[yl[0]-22,yl[1]+8],[yl[0]-8,yl[1]+3],[yl[0]+6,yl[1]+2],[yl[0]+22,yl[1]-4]];
  brush(g,canal,1.5,.2,'rgb(70,108,104)',.62);
  [1,3].forEach((k,qi)=>{
    const x=canal[k][0], y=canal[k][1];
    brush(g,[[x-3,y-4],[x,y-1],[x+3,y-4]],.9,.2,'rgb(96,82,56)',.75);
  });
  inkNote(g,'运粮河',yl[0]-26,yl[1]+20);

  // ⑨ 白马津 / 延津浮桥：一排不连的舟 + 缆笔，非江南石拱
  const bm=P(LANDMARKS.baimajin);
  brush(g,[[bm[0]-24,bm[1]+2],[bm[0],bm[1]+1],[bm[0]+24,bm[1]+2]],.8,.2,'rgb(92,76,52)',.6);
  for(let k=0;k<6;k++){
    const x=bm[0]-20+k*8+(rnd(k*3.3)-.5)*2;
    brush(g,[[x-3,bm[1]],[x,bm[1]-2.4],[x+3.4,bm[1]]],1.1,.3,'rgb(96,74,52)',.8);
  }
  inkNote(g,'白马津',bm[0]+30,bm[1]-18);

  // ⑩ 乌巢粮囷：不等距、半径各异的断续囤笔（汉囷为圆，但只画弧，不画闭合圆）
  const wc=P(LANDMARKS.wuchao);
  for(let q=0;q<5;q++){
    const x=wc[0]-13+q*6.6+(rnd(q*5.1)-.5)*3, y=wc[1]+(rnd(q*3.7)-.5)*5;
    const rx=2.2+rnd(q*7)*1.5, ry=1.9+rnd(q*11)*1.1;
    const st=Math.floor(rnd(q*9)*5), ln=7+Math.floor(rnd(q*13)*4), pts=[];
    for(let t=0;t<ln;t++){
      const a=(st+t)/13*Math.PI*2;
      pts.push([x+Math.cos(a)*rx,y+Math.sin(a)*ry]);
    }
    brush(g,pts,.95,.38,'rgb(104,82,56)',.82);
    brush(g,[[x, y],[x+.4,y-2.2],[x+1,y-4]],.6,.3,'rgb(150,124,84)',.6);   // 囤顶
  }
  for(let k=0;k<5;k++)
    brush(g,[[wc[0]-14, wc[1]+8+k*1.6],[wc[0],wc[1]+7+k*1.6],[wc[0]+15,wc[1]+8+k*1.6]],.6,.1,'rgb(128,104,70)',.45);
  inkNote(g,'乌巢',wc[0]+26,wc[1]+14);

  // ⑪ 居延塞积薪：《塞上烽火品约》积薪重两吨、外涂泥沙，苣火夜举
  const jy=P(LANDMARKS.juyan);
  for(let q=0;q<4;q++)
    irregular(g,jy[0]+(rnd(q*3.7)-.5)*9,jy[1]+(rnd(q*7.1)-.5)*5,
      3+rnd(q*5)*2,2+q*.4,460+q,'rgba(138,116,82,.72)','rgb(84,68,48)',.9);
  brush(g,[[jy[0]+9,jy[1]-3],[jy[0]+10,jy[1]-9],[jy[0]+9,jy[1]-14]],1.4,.3,'rgb(166,49,41)',.8);
  sealLabel(g,'积薪',jy[0]-22,jy[1]-20,'other');

  // ⑫ 蜀郡临邛火井：汉代已见记载的天然气井，井口 + 井架 + 一点幽火
  const hj=P(LANDMARKS.huojing);
  irregular(g,hj[0],hj[1],3.2,2.6,470,'rgba(196,180,146,.82)','rgb(84,68,48)',1);
  brush(g,[[hj[0]-5,hj[1]+2],[hj[0],hj[1]-9],[hj[0]+5,hj[1]+2]],1.1,.2,'rgb(78,64,46)',.8);
  brush(g,[[hj[0]-4,hj[1]-7],[hj[0]+4,hj[1]-7]],.8,.15,'rgb(78,64,46)',.7);
  brush(g,[[hj[0]-1,hj[1]-3],[hj[0]+.5,hj[1]-7],[hj[0]+1.5,hj[1]-11]],1,.25,'rgb(166,49,41)',.75);
  inkNote(g,'火井',hj[0]+9,hj[1]+4);

  // ⑬ 会稽鉴湖：东汉永和五年（140）马臻筑，不规则湖 + 断续堤塘 + 斗门
  const jh=P(LANDMARKS.jianhu);
  irregular(g,jh[0],jh[1],14,7,471,'rgba(74,120,126,.30)','rgba(56,96,104,.36)',1);
  const dh=[]; for(let k=0;k<=8;k++) dh.push([jh[0]-15+k*3.8, jh[1]+8+Math.sin(k*.8)*1.6]);
  for(let k=0;k<dh.length-1;k+=2)
    brush(g,[dh[k],dh[k+1],dh[Math.min(k+2,dh.length-1)]],.9,.15,'rgb(120,100,68)',.62);
  for(let k=0;k<3;k++)
    irregular(g,jh[0]-9+k*9,jh[1]+9,1.6,1.8,480+k,'rgba(214,198,160,.8)','rgb(96,78,54)',.9);
  inkNote(g,'鉴湖',jh[0]+18,jh[1]+12);

  // 州治 / 郡治分级：不规则墨点随图走，文字交给注记层
  CAPITALS.forEach((p,idx)=>{
    const x=lon2x(p.l), y=lat2y(p.t);
    if(p.k==='capital'){
      // 界画小城：四角确定性抖偏、边中点侧摆，×4 下不读成标准方廓。
      // 仍不闭合、仍留门缺，只是角活了。
      const R=4.6+rnd(idx*2.7)*1.8, w=.95;
      const jit=(s)=>(rnd(idx*13.7+s*3.13)-.5)*2.8;
      const C=[[x-R+jit(1),  y-R*.82+jit(2)],
               [x+R+jit(3),  y-R*.78+jit(4)],
               [x+R*.92+jit(5), y+R*.84+jit(6)],
               [x-R*.94+jit(7), y+R*.8+jit(8)]];
      const seg=(i,s)=>{
        const A=C[i], B=C[(i+1)%4];
        brush(g,[A,[(A[0]+B[0])/2+jit(s)*1.4,(A[1]+B[1])/2+jit(s+9)*1.4],B],
               w,.55,'rgb(64,52,36)',.82);
      };
      if(rnd(idx*7.1)>.16) seg(0,1);   // 上边留门缺
      seg(1,2); seg(2,3);
      if(rnd(idx*3.3)>.2) seg(3,4);
      brush(g,[[x-1,y-R*.8],[x,y-R*.8-2],[x+1,y-R*.8]],.7,.4,'rgb(166,49,41)',.7); // 门
      labels.push({mx:x,my:y-16,txt:p.n,level:1,kind:'capital'});
    } else {
      irregular(g,x,y,2.2,2.0,700+idx,'rgb(72,60,42)',null,0);
      labels.push({mx:x,my:y-6,txt:p.n,level:2,kind:'cmd'});
    }
  });
  // 三级县邑：极小墨点，仅大局部 / 高倍率下显字
  COUNTIES.forEach((c,idx)=>{
    const x=lon2x(c[1]), y=lat2y(c[2]);
    irregular(g,x,y,1.4,1.3,800+idx,'rgba(72,60,42,.70)',null,0);
    labels.push({mx:x,my:y-5,txt:c[0],level:3,kind:'county'});
  });

  // 题识、比例尺、朱印（随图走，不悬在纸外）
  g.textAlign='left';
  const tt=(s,x,y,f,c)=>{ g.font=f; g.lineWidth=3.2; g.strokeStyle='rgba(236,228,206,.92)';
    g.strokeText(s,x,y); g.fillStyle=c; g.fillText(s,x,y); };
  tt('建安五年 · 十三州全境', 36, 56, 'bold 24px serif','rgba(40,34,26,.92)');
  tt('西止玉门 · 东含乐浪 · 南尽日南 · 纵横不拘实距', 38, 78, '12px serif','rgba(72,60,44,.86)');
  tt('朱题三：官渡连营 · 雒阳灵台 · 居延积薪（余景见墨注）', 38, 96, '11px serif','rgba(116,50,38,.84)');
  // 比例尺：断续短笔刻度，不用贯通直线
  const sx=W-236, sy=H-92;
  for(let k=0;k<12;k++){
    const x=sx+k*15;
    brush(g,[[x,sy],[x+7,sy-.4],[x+14,sy]],.8,.2,'rgb(60,50,36)',.8);
    if(k%3===0) brush(g,[[x,sy-3],[x+.5,sy],[x,sy+3]],.7,.15,'rgb(60,50,36)',.8);
  }
  g.fillStyle='rgba(60,50,36,.85)'; g.font='11px serif'; g.textAlign='center';
  g.fillText('约千里',sx+90,sy-8);
  // 朱印：手刻缺损边，方形但非纯几何 rect
  g.save(); g.translate(W-72,H-158); g.rotate(-.04);
  sealBox(g,22,'rgba(166,49,41,.82)','rgba(243,231,210,.8)');
  sealBox(g,18,null,'rgba(243,231,210,.55)');
  g.fillStyle='#f3e7d2'; g.font='bold 19px serif'; g.textAlign='center';
  g.fillText('建安',0,-2); g.fillText('五年',0,17); g.restore();
  /* 分图专属地物：只在对应分图重建地物层时出现，全境默认不画。
     仍是各自单独的一次性笔路，不是图章循环。势力一概不画。 */
  if(f==='hebei'){
    // 邺、黎阳、白马一线的东汉坞堡：不闭合方墙 + 四角望楼，尺寸朝向各异
    [[114.62,36.32],[114.55,35.68],[114.42,35.55],[115.03,35.75]].forEach((q,i)=>{
      const [hx,hy]=P(q), R=6+rnd(i*13.7)*4;
      const wall=(x1,y1,x2,y2)=>brush(g,[[hx+x1,hy+y1],[(hx*2+x1+x2)/2,hy+(y1+y2)/2-.5],[hx+x2,hy+y2]],.8,.45,'rgb(62,52,38)',.80);
      wall(-R,-R*.8,-R*.1,-R*.8); wall(R*.2,-R*.8,R,-R*.8);
      wall(R,-R*.8,R,R*.8); wall(R,R*.8,-R*.2,R*.8);
      if(rnd(i*5.3)>.24) wall(-R,R*.8,-R,-R*.8);
      for(const [ox,oy] of [[-R,-R*.8],[R,-R*.8],[-R,R*.8],[R,R*.8]]){
        irregular(g,hx+ox,hy+oy,1.5,1.5,900+i*4+ox,'rgba(226,210,172,.80)','rgb(78,62,42)',.7);
      }
      labels.push({mx:hx,my:hy-R-8,txt:'坞',level:2,kind:'ink',area:'hebei'});
    });
  }
  if(f==='jingyang'){
    // 鉴湖、云梦、彭蠡一带水田：成簇平行田埂短笔，倾斜缺笔，不闭合方框
    [[120.58,29.98],[112.60,30.10],[116.20,29.60],[115.86,28.68]].forEach((q,i)=>{
      const [cx,cy]=P(q);
      for(let k=0;k<11;k++){
        if(rnd(i*31+k*7.3)>.34) continue;
        const a=rnd(i*17+k*3.1)*2.4, dx=(rnd(i*23+k*5.7)-.5)*34,
              dy=(rnd(i*29+k*9.1)-.5)*22, L=4+rnd(i*37+k*2.2)*4;
        const ca=Math.cos(a), sa=Math.sin(a);
        for(let t=0;t<3;t++){
          const off=t*2.1;
          brush(g,[[cx+dx-L*ca+off*sa,cy+dy-L*sa-off*ca],
                   [cx+dx+off*sa,cy+dy-off*ca],
                   [cx+dx+L*.8*ca+off*sa,cy+dy+L*.8*sa-off*ca]],
                .7,.12,'rgba(56,104,84,.50)',.48);
        }
      }
      labels.push({mx:cx+18,my:cy-10,txt:'陂田',level:2,kind:'ink',area:'jingyang'});
    });
  }
  // 注记区域标记：由锚点反算，仅用于「朱题不串场」，其余仍交给视口裁剪
  for(const L of labels){
    if(L.area) continue;
    const lo=x2lon(L.mx), la=y2lat(L.my);
    L.area = la>=35.6 && lo>=112 && lo<=121 ? 'hebei'
           : lo>=112 && lo<=117.4 && la>=32.0 ? 'zhongyuan'
           : lo>=109.5 && lo<=121.5 && la>=24.0 && la<=32.0 ? 'jingyang' : 'other';
  }
  return c;
}
function beacon(g,x,y,idx,k){
  const s=3.0+k*2.4;                      // 大小不一
  g.save(); g.translate(x,y);
  sealBox(g,s,'rgba(226,210,172,.85)','rgba(78,62,42,.82)');
  g.restore();
  irregular(g,x-s-1,y-s-2,1.1,1.1,900+k+x*.01,'rgb(78,62,42)',null,0);  // 角楼
  irregular(g,x+s-.6,y-s-2,1.1,1.1,910+k+y*.01,'rgb(78,62,42)',null,0);
  if(idx===0 && k>.62){                 // 积薪：仅部分台有
    brush(g,[[x,y-s-2],[x+1,y-s-5],[x+1,y-s-9]],.9,.2,'rgb(120,96,64)',.55);
  }
}

/* ---------- 屏幕空间工笔细笔层 ----------
   背景是固定分辨率的离屏 canvas，放大后会变成糊色块。这一层在屏幕空间按固定像素步长
   重新落笔：笔宽恒定、双勾留水线，反算地理坐标决定笔型/方向/疏密（笔跟着地走，不跟屏幕漂）。
   zoom 高时渐显，把「放大的色块」读成「笔」，同时补上工笔最后一道：双勾 + 水线。 */
function drawInkDetail(){
  const a=clamp((zoom-1.45)/1.05,0,1);
  if(a<=0.02 || !showFeatures || !showInk) return 0;
  // 越近看，细笔越密：放大后补出更细的笔，把被拉大的斜划之间的缝填上
  const step=clamp(38/Math.sqrt(zoom),15,34);
  const toMap=(sx,sy)=>[ (sx-W/2-panX)/zoom+W/2, (sy-H/2-panY)/zoom+H/2 ];
  ctx.save(); ctx.globalAlpha=a*.62;
  let cnt=0;
  for(let sy=-step;sy<H+step;sy+=step){
    for(let sx=-step;sx<W+step;sx+=step){
      const [mx,my]=toMap(sx,sy);
      if(mx<0||mx>W||my<0||my>H) continue;
      const lon=x2lon(mx), lat=y2lat(my);
      const [,,,r]=fieldColor(lon,lat);
      const n=fbm(lon*1.7,lat*1.9,seed*.002);
      // 低频簇场：簇内才落笔，簇间整片空 —— 密处成团、疏处留白，不出现均匀网纹
      const cluster=fbm(lon*.55,lat*.62,seed*.017);
      if(cluster<.535) continue;
      const q=rnd(Math.round(lon*140)*.017+Math.round(lat*140)*.031+seed*.0001);
      if(q > clamp((cluster-.535)*3.4,0,.62)*(0.45+0.55*r.density)) continue;
      const ang=r.wind+(n-.5)*1.5, ca=Math.cos(ang), sa=Math.sin(ang);
      const jx=sx+(q-.5)*step*.9, jy=sy+(rnd(q*97+lon)-.5)*step*.9;
      const rot=(dx,dy)=>[jx+dx*ca-dy*sa, jy+dx*sa+dy*ca];
      /* 树种连续场：密 + 湿 + 南 → 针叶 / 阔叶，稀 + 燥 + 沙 → 灌丛。
         不是随机四选一：权重由场值连续给出，过渡带里三套笔交错。
         放大后「一簇簇可辨小团」的根因就是团只换色和尺寸、不换笔型。 */
      const canopy = clamp(0.16 + 0.60*r.density + 0.26*r.south + 0.14*r.wet
                           - 0.34*r.desert - 0.22*r.lingnan - 0.18*r.coast
                           - 0.16*r.sand - 0.12*r.karst + (n-.5)*.26, 0, 1);
      const needle = clamp((canopy-.46)/.40, 0, 1);
      const shrub  = clamp((.50-canopy)/.36, 0, 1);
      const broad  = clamp(1-needle-shrub, 0, 1);
      const pick = rnd(lon*71+lat*43);
      const wNeedle = needle*.74, wShrub = shrub*.66;
      const L = (3+rnd(lon*13+lat*7)*4.4) * (0.82 + needle*.42 - shrub*.24);
      const W0 = 0.80 + broad*.55 + shrub*.42 - needle*.22;
      // 双勾只在簇心、且只占约两成；其余写意，避免每笔都带框
      const hook = cluster>.66 && rnd(lon*29+lat*17)<.26;
      // 色阶也连续：锚点间线性插值 + 小幅噪声，没有 if 切出来的色片台阶
      let cc = mix([114,92,62],[46,70,54], clamp(r.south*.70+r.wet*.50,0,1));
      cc = mix(cc,[138,112,78], clamp(r.desert*.80+r.sand*.40,0,1));
      cc = mix(cc,[72,100,74],  clamp(r.lingnan*.50+r.karst*.30,0,1));
      const cd=(n-.5)*16;
      const col=`rgba(${Math.round(clamp(cc[0]+cd,0,255))},${Math.round(clamp(cc[1]+cd,0,255))},${Math.round(clamp(cc[2]+cd*.8,0,255))},${(0.42+0.10*broad).toFixed(2)})`;
      if(pick < wNeedle){
        // 针叶：两三根细长收尖的笔从一点向外，夹角小、笔更窄
        const fan=.18+rnd(lon*37+lat*11)*.22;
        for(let t=0;t<3;t++){
          const d=(t-1)*fan;
          brush(ctx,[rot(-L*.18,d*.4),rot(0,d-1.2),rot(L,d*.7-.6)],W0*.62,.12,col,1,t===1&&hook);
        }
      } else if(pick < wNeedle+wShrub){
        // 灌丛：横走扁平、短而宽，三四笔错开，不排成阵列
        for(let t=0;t<3;t++){
          const d=t*2.1-2.1, l=L*(.55+rnd(lon*t*17+lat*5)*.35);
          brush(ctx,[rot(-l,d),rot(0,d-.7),rot(l*.9,d+.3)],W0*.82,.16,col,1,false);
        }
      } else {
        // 阔叶：短粗成簇，一主一副，双勾只在簇心
        brush(ctx,[rot(-L*.8,1.2),rot(-L*.12,-1.4),rot(L*.7,.6)],W0,W0*.30,col,1,hook);
        if(cluster>.68) brush(ctx,[rot(-L*.32,3.4),rot(L*.45,2.2)],W0*.48,.18,col,1,false);
      }
      cnt++;
    }
  }
  ctx.restore();
  return cnt;
}

/* ---------- 合成 + 格网 LOD ---------- */
function composite(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0e1310'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+panX,H/2+panY); ctx.scale(zoom,zoom); ctx.translate(-W/2,-H/2);
  if(bg) ctx.drawImage(bg,0,0,W,H);
  if(showFeatures && fg) ctx.drawImage(fg,0,0,W,H);
  ctx.restore();
  // 格网：墨底 + 亮金双色，按 zoom 连续退场
  let state='格网 · 全隐';
  if(showGrid){
    const z=zoom, cell=46*z, alphaFine=clamp((z-0.62)/0.32,0,1), alphaMajor=clamp((z-0.38)/0.30,0,1);
    if(alphaFine>0.01){
      ctx.save(); ctx.globalAlpha=alphaFine*.30;
      ctx.strokeStyle='#c8a86a'; ctx.lineWidth=1/z;
      ctx.beginPath();
      for(let x=(panX%cell+cell)%cell;x<W;x+=cell){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
      for(let y=(panY%cell+cell)%cell;y<H;y+=cell){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
      ctx.stroke(); ctx.restore();
    }
    if(alphaMajor>0.01){
      ctx.save(); ctx.globalAlpha=alphaMajor*.50;
      ctx.strokeStyle='#e0c287'; ctx.lineWidth=1.3/z;
      const m=cell*5; ctx.beginPath();
      for(let x=(panX%m+m)%m;x<W;x+=m){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
      for(let y=(panY%m+m)%m;y<H;y+=m){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
      ctx.stroke(); ctx.restore();
    }
    state = z>=0.94 ? '格网 · 全显' : z>=0.62 ? '格网 · 抽稀' : z>=0.38 ? '格网 · 主格' : '格网 · 全隐';
  } else state='格网 · 关闭';
  const inkN = drawInkDetail();
  const noteState = (showFeatures && bg) ? drawLabels() : '注记 · 关闭';
  const inkState = inkN>0 ? ` · 工笔 ${inkN} 笔` : '';
  document.getElementById('gridState').textContent =
    `${FOCUS[focus].title.split(' · ')[0]} · ${state} · ×${zoom.toFixed(2)} · 格距 ${(46*zoom).toFixed(0)}px · ${noteState}${inkState}`;
}
/* 背景按倍率分档重渲：只在跨档时重算，滚轮/拖动仍即时合成 */
let bgTier = 1;
const tierOf = z => clamp(Math.round(z),1,3);
function rebuild(t){
  bgTier = t||1;
  bg = makeBg(bgTier);
  fg = makeFg(focus);
  composite();
}
function ensureBgTier(){
  const t=tierOf(zoom);
  if(t!==bgTier){ bg=makeBg(t); bgTier=t; }
}

/* ---------- 交互 ---------- */
function setZoom(nz,cx,cy){
  const n=clamp(nz,0.28,4.2);
  if(cx!==undefined){
    panX = cx-(cx-panX)*(n/zoom); panY = cy-(cy-panY)*(n/zoom);
  }
  zoom=n; ensureBgTier(); composite();
}
document.getElementById('redraw').onclick=()=>{ seed=Math.floor(Math.random()*99991)+1; rebuild(tierOf(zoom)); };
document.getElementById('toggleFeatures').onclick=e=>{ showFeatures=!showFeatures; e.target.setAttribute('aria-pressed',showFeatures); composite(); };
document.getElementById('toggleInk').onclick=e=>{ showInk=!showInk; e.target.setAttribute('aria-pressed',showInk); composite(); };
document.getElementById('toggleGrid').onclick=e=>{ showGrid=!showGrid; e.target.setAttribute('aria-pressed',showGrid); composite(); };
document.getElementById('zoomIn').onclick=()=>setZoom(zoom*1.28);
document.getElementById('zoomOut').onclick=()=>setZoom(zoom/1.28);
/* 四档视角切换：分图重建地物层（专属地物随档出现），背景按倍率分档重渲 */
const VIEW_BTNS=[['toggleDetail','zhongyuan'],['viewHebei','hebei'],['viewJingyang','jingyang']];
function setView(f){
  focus=FOCUS[f]?f:'all';
  const V=VIEWS[focus];
  zoom=V.zoom;
  const mx=lon2x(V.lon), my=lat2y(V.lat);
  panX=-(mx-W/2)*zoom; panY=-(my-H/2)*zoom;
  for(const [id,k] of VIEW_BTNS)
    document.getElementById(id).setAttribute('aria-pressed',String(focus===k));
  rebuild(tierOf(zoom));
}
VIEW_BTNS.forEach(([id,k])=>{
  document.getElementById(id).onclick=()=>setView(focus===k?'all':k);
});
document.getElementById('reset').onclick=()=>setView('all');
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect();
  setZoom(zoom*(e.deltaY<0?1.12:1/1.12), e.clientX-r.left, e.clientY-r.top); },{passive:false});
cv.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!dragging)return; panX+=e.clientX-lastX; panY+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; composite(); });
cv.addEventListener('pointerup',()=>{ dragging=false; cv.classList.remove('drag'); });
window.addEventListener('resize',composite);
rebuild(1);
})();
</script>
