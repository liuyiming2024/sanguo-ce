'use strict';
const W = 1400, H = 1100;
const LON0=93, LON1=126, LAT0=15, LAT1=43;           // 图幅：西止玉门、东含乐浪、南含日南
const lon2x = l => (l-LON0)/(LON1-LON0)*W;
const lat2y = t => (LAT1-t)/(LAT1-LAT0)*H;

const y2lat = y => LAT1 - y/H*(LAT1-LAT0);

/* ---------- 确定性噪声 ---------- */
function h2(i,j,s){ const n = Math.sin(i*127.1 + j*311.7 + s*74.7)*43758.5453; return n-Math.floor(n); }
function sm(t){ return t*t*(3-2*t); }
function vn(x,y,s){
  const i=Math.floor(x), j=Math.floor(y), fx=sm(x-i), fy=sm(y-j);
  const a=h2(i,j,s), b=h2(i+1,j,s), c=h2(i,j+1,s), d=h2(i+1,j+1,s);
  return (a+(b-a)*fx) + ((c+(d-c)*fx)-(a+(b-a)*fx))*fy;
}
function fbm(x,y,s){ return vn(x,y,s)*.56 + vn(x*2.1,y*2.1,s+3)*.29 + vn(x*4.3,y*4.3,s+7)*.15; }
function rnd(s){ const n=Math.sin(s*12.9898+seed*0.017)*43758.5453; return n-Math.floor(n); }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mix(c1,c2,t){ return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]; }

/* ---------- 区域权重：南北之别是连续场，不是分区填色 ---------- */
const C_NORTH=[186,168,126], C_SOUTH=[118,148,120], C_DESERT=[214,197,160],
      C_LINGNAN=[152,170,134], C_WET=[92,126,130];
function region(lon,lat){
  // 秦岭—淮河线随经度起伏，过渡带宽 8 度，避免硬切
  const qin = 33.2 + 0.9*Math.sin((lon-104)*0.42) + (lon<112?0.5:0)
              + (fbm(lon*1.3,lat*1.1,seed*.004)-.5)*1.4;
  const south = clamp((qin+1.4-lat)/8.0, 0, 1);
  const desert = clamp((lat-37)/7,0,1)*clamp((108-lon)/14,0,1);
  const lingnan = clamp((25-lat)/10,0,1);
  const wet = clamp(1-Math.abs(lat-30.6)/2.8,0,1)*clamp((lon-104)/9,0,1)*0.42;
  // 密度：中原与江南高，河西/塞北/岭南低；由连续场给出，不按区硬切
  const core = Math.exp(-Math.pow((lat-33.5)/9,2)) * clamp((lon-100)/10,0,1);
  const density = clamp(0.20 + 0.72*core + 0.30*wet - 0.42*desert - 0.30*lingnan
                  + (fbm(lon*.42,lat*.48,seed*.006)-.5)*0.5, 0.06, 1);
  // 风势：连续场决定笔向，相邻区域渐变而非全图同向
  const wind = (fbm(lon*.32,lat*.36,seed*.008)-.5)*2.4 + (south-.5)*0.5;
  return {south,desert:clamp(desert,0,1),lingnan,wet,qin,density,wind};
}
function fieldColor(lon,lat){
  const r=region(lon,lat), n=fbm(lon*0.55, lat*0.62, seed*0.001);
  let c=mix(C_NORTH,C_SOUTH,r.south);
  c=mix(c,C_DESERT,r.desert*0.86);
  c=mix(c,C_LINGNAN,r.lingnan*0.42);
  c=mix(c,C_WET,r.wet*0.48);
  const d=(n-0.5)*38;
  return [clamp(c[0]+d,0,255),clamp(c[1]+d,0,255),clamp(c[2]+d*0.8,0,255), r];
}

/* ---------- 变宽多边形笔：根部聚一点、起粗收尖，一次 fill ---------- */
function brush(g, pts, w0, w1, color, alpha){
  if(pts.length<2) return;
  const L=[], R=[];
  for(let k=0;k<pts.length;k++){
    const p=pts[k], a=pts[Math.max(0,k-1)], b=pts[Math.min(pts.length-1,k+1)];
    let dx=b[0]-a[0], dy=b[1]-a[1]; const m=Math.hypot(dx,dy)||1; dx/=m; dy/=m;
    const t=k/(pts.length-1);
    const w=(lerp(w0,w1,t)) * (0.72+0.42*Math.sin(t*Math.PI));
    L.push([p[0]-dy*w, p[1]+dx*w]); R.push([p[0]+dy*w, p[1]-dx*w]);
  }
  g.beginPath(); g.moveTo(L[0][0],L[0][1]);
  for(let k=1;k<L.length;k++) g.lineTo(L[k][0],L[k][1]);
  for(let k=R.length-1;k>=0;k--) g.lineTo(R[k][0],R[k][1]);
  g.closePath(); g.globalAlpha=alpha; g.fillStyle=color; g.fill(); g.globalAlpha=1;
}
function line(g,pts,color,width,alpha,dash){
  g.beginPath(); g.moveTo(pts[0][0],pts[0][1]);
  for(let k=1;k<pts.length;k++) g.lineTo(pts[k][0],pts[k][1]);
  g.strokeStyle=color; g.lineWidth=width; g.globalAlpha=alpha===undefined?1:alpha;
  if(dash) g.setLineDash(dash); else g.setLineDash([]);
  g.stroke(); g.setLineDash([]); g.globalAlpha=1;
}
function P(arr){ return arr.map(([l,t])=>[lon2x(l),lat2y(t)]); }

/* ---------- 背景层：连续底罩 + 一次性扫描游走笔触 ---------- */
function makeBg(){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');
  // 纸底
  g.fillStyle='#e9e3d1'; g.fillRect(0,0,W,H);
  // 连续场底罩：低分辨率生成后平滑放大，无台阶
  const FW=350, FH=275, im=g.createImageData(FW,FH);
  for(let j=0;j<FH;j++) for(let i=0;i<FW;i++){
    const lon=LON0+i/FW*(LON1-LON0), lat=LAT1-j/FH*(LAT1-LAT0);
    const [r,gg,b,reg]=fieldColor(lon,lat);
    const k=(j*FW+i)*4;
    im.data[k]=r; im.data[k+1]=gg; im.data[k+2]=b;
    // 底罩不铺满：密度越低纸透得越多，边地留一丢丢白
    im.data[k+3]=Math.round(255*clamp(0.56+0.44*reg.density,0,1));
  }
  const fc=document.createElement('canvas'); fc.width=FW; fc.height=FH;
  fc.getContext('2d').putImageData(im,0,0);
  g.drawImage(fc,0,0,W,H);

  // 图廓
  g.strokeStyle='rgba(120,92,52,.55)'; g.lineWidth=2; g.strokeRect(14,14,W-28,H-28);
  g.strokeStyle='rgba(120,92,52,.28)'; g.lineWidth=1; g.strokeRect(21,21,W-42,H-42);

  // 泽：沙洲 + 芦苇（由泽形派生，不复制图章）
  MARSHES.forEach(m=>{
    const cx=lon2x(m.l), cy=lat2y(m.t), rx=lon2x(m.l+m.rx)-cx, ry=lat2y(m.t)-lat2y(m.t+m.ry);
    g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    g.fillStyle='rgba(74,120,126,.34)'; g.fill();
    g.strokeStyle='rgba(56,96,104,.42)'; g.lineWidth=1; g.stroke();
    const cnt=Math.round(30+m.rx*40);
    for(let k=0;k<cnt;k++){
      const a=rnd(k*3.1+m.l)*Math.PI*2, rr=0.55+0.45*rnd(k*5.7+m.t);
      const x=cx+Math.cos(a)*rx*rr, y=cy+Math.sin(a)*ry*rr;
      brush(g,[[x,y-3],[x+1,y-6],[x+2,y-9]],1.2,.15,'#3f6f62',.5);
    }
    // 沙洲
    for(let k=0;k<3;k++){
      const x=cx+(rnd(k*7.3+m.l)-.5)*rx*1.1, y=cy+(rnd(k*9.1+m.t)-.5)*ry;
      g.beginPath(); g.ellipse(x,y,rx*.16,ry*.18,0,0,Math.PI*2);
      g.fillStyle='rgba(224,210,172,.72)'; g.fill();
    }
  });

  // 河：双勾岸 + 淡青罩 + 顺流波纹（断续，笔断意连）
  RIVERS.forEach((rv,idx)=>{
    const p=P(rv.p);
    line(g,p,'rgba(66,88,86,.38)',rv.w+2.6,.30);
    line(g,p,'rgba(228,222,202,.50)',rv.w*.86,.45);
    line(g,p,'rgba(86,116,116,.58)',rv.w*.42,.60);
    for(let k=0;k<p.length-1;k++){
      const a=p[k], b=p[k+1], seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const n=Math.max(2,Math.round(seg/26));
      for(let q=0;q<n;q++){
        if(rnd(idx*91+k*13+q*2.7)<.34) continue;
        const t=(q+.5)/n, x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
        brush(g,[[x-6,y+1],[x-1,y],[x+5,y-1]],.8,.12,'rgba(60,110,118,.6)',.55);
      }
    }
  });

  // 山脉骨架：沿脊线一次性山脉带 + 顺坡短笔
  RIDGES.forEach((rg,idx)=>{
    const p=P(rg.p);
    // 山脉带
    g.beginPath(); g.moveTo(p[0][0],p[0][1]-8*rg.a);
    for(let k=0;k<p.length;k++){
      const q=p[k], wob=Math.sin(k*2.1+idx)*5*rg.a;
      g.lineTo(q[0],q[1]-9*rg.a+wob);
    }
    for(let k=p.length-1;k>=0;k--) g.lineTo(p[k][0],p[k][1]+9*rg.a);
    g.closePath(); g.fillStyle='rgba(96,104,84,.30)'; g.fill();
    line(g,p,'rgba(72,78,62,.72)',1.6*rg.a,.8);
    // 顺坡皴：方向随脊线法向，长度随起伏变
    for(let k=0;k<p.length-1;k++){
      const a=p[k], b=p[k+1], seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const n=Math.round(seg/12);
      for(let q=0;q<n;q++){
        const t=(q+.5)/n, x=lerp(a[0],b[0],t), y=lerp(a[1],b[1],t);
        const side=(q%2?1:-1), len=(9+8*rnd(idx*33+k*7+q))*rg.a;
        brush(g,[[x,y],[x+2*side,y+len*.5],[x+4*side,y+len]],1.5,.12,'rgba(66,74,58,.55)',.55);
      }
    }
  });

  // 地表笔触：不等距扫描游走，笔型 / 密度 / 方向全由连续场决定
  const rowStep=12;
  for(let y=8;y<H-8;y+=rowStep){
    let x=-18+rnd(y*.37)*24;
    while(x<W+18){
      const lon=x2lon(x), lat=y2lat(y), [,, ,r]=fieldColor(lon,lat);
      const n=fbm(lon*1.7,lat*1.9,seed*.002);
      const dens=r.density;
      const step=lerp(26,8,dens)+rnd(x*.13+y*.07)*8;
      // 边地留白：密度越低越常跳笔，白从笔缝里连续漏出
      if(rnd(x*.031+y*.017) > 0.30+0.68*dens){ x+=step*.7; continue; }
      const ang=r.wind, ca=Math.cos(ang), sa=Math.sin(ang);
      const rot=(dx,dy)=>[x+dx*ca-dy*sa, y+dx*sa+dy*ca];
      // 笔型按场权重概率混合：过渡带里两套笔交错，不出现硬切线
      const pick=rnd(x*.053+y*.021+n*3.1);
      const wDesert=r.desert*0.86, wLing=r.lingnan*0.60, wSouth=r.south*0.92;
      if(pick < wDesert || (lat>40.5 && n>.55)){
        // 沙碛 / 塞北：极稀的横向短弧，笔数最少
        if(n>.34) brush(g,[rot(-9,0),rot(0,-2),rot(10,1)],.9,.12,'rgba(150,126,88,.40)',.42);
      } else if(pick < wDesert+wLing){
        // 岭南：疏点，不铺满
        if(n>.46){
          g.beginPath(); g.arc(x,y,1.2+rnd(x*.7)*1.3,0,Math.PI*2);
          g.fillStyle='rgba(88,110,80,.40)'; g.fill();
        }
      } else if(pick < wDesert+wLing+wSouth){
        // 南方：田块只在低频高值区成簇，且随风向倾斜、时有缺笔
        const cluster=fbm(lon*.72,lat*.83,seed*.011);
        if(cluster>.44 && rnd(x*.33+y*.19)>.20){
          const s=3+rnd(x*.21)*5;
          const q=[rot(-s,-s*.7),rot(s,-s*.7),rot(s,s*.7),rot(-s,s*.7)];
          g.beginPath(); g.moveTo(q[0][0],q[0][1]);
          for(let i=1;i<4;i++) g.lineTo(q[i][0],q[i][1]);
          g.closePath(); g.strokeStyle='rgba(56,94,72,.40)'; g.lineWidth=.8; g.stroke();
          for(let i=0;i<3;i++)
            brush(g,[rot(-s*.7,i*2.2-s*.5),rot(0,i*2.2-s*.5),rot(s*.7,i*2.2-s*.5)],.5,.08,'rgba(64,104,80,.44)',.48);
        } else {
          brush(g,[rot(-3,3),rot(0,-3),rot(4,2)],1.2,.14,'rgba(46,88,68,.52)',.48);
        }
      } else {
        // 北方：横向燥笔束（战后荒田，短、断、稀）
        const c = n>.55 ? 'rgba(56,76,62,.58)' : 'rgba(126,100,64,.50)';
        const L=5+rnd(x*.19)*6;
        const dy=Math.sin(ang)*2;
        brush(g,[rot(-L,dy),rot(0,dy-1),rot(L,dy+.5)],1.6,.12,c,.52);
        if(n>.72) brush(g,[rot(-2,3),rot(0,0),rot(3,-3)],1.0,.1,'rgba(50,70,56,.5)',.44);
      }
      x+=step;
    }
  }
  return c;
}

/* ---------- 地物层 ---------- */
function makeFg(){
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  const g=c.getContext('2d');

  // 势力渗透：径向渐变团，非实心色块
  POWERS.forEach((p,idx)=>{
    const cx=lon2x(p.l), cy=lat2y(p.t), rx=lon2x(p.l+p.r)-cx, ry=lat2y(p.t)-lat2y(p.t+p.r);
    const gr=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(rx,ry));
    gr.addColorStop(0,`rgba(${p.c},.20)`); gr.addColorStop(.62,`rgba(${p.c},.09)`); gr.addColorStop(1,`rgba(${p.c},0)`);
    g.save(); g.translate(cx,cy); g.scale(1,ry/rx); g.translate(-cx,-cy);
    g.fillStyle=gr; g.beginPath(); g.arc(cx,cy,rx,0,Math.PI*2); g.fill(); g.restore();
    g.font='13px serif'; g.textAlign='center'; g.lineWidth=2.6;
    g.strokeStyle='rgba(236,228,206,.72)'; g.strokeText(p.n,cx,cy+4);
    g.fillStyle='rgba(74,58,40,.70)'; g.fillText(p.n,cx,cy+4);
  });
  // 汝南：朱白相间渗透带（建安五年拉锯区）
  const rx0=lon2x(114.2), rx1=lon2x(115.6), ry0=lat2y(33.6), ry1=lat2y(32.4);
  for(let k=0;k<26;k++){
    const x=lerp(rx0,rx1,rnd(k*3.3)), y=lerp(ry0,ry1,rnd(k*5.1));
    g.fillStyle = k%2 ? 'rgba(166,49,41,.07)' : 'rgba(233,227,209,.13)';
    g.fillRect(x,y,26+rnd(k*7)*30,5);
  }

  // 州界朱线（示意）
  STATES.forEach(s=>{
    const p=P(s.p); g.beginPath(); g.moveTo(p[0][0],p[0][1]);
    for(let k=1;k<p.length;k++) g.lineTo(p[k][0],p[k][1]);
    g.closePath(); g.strokeStyle='rgba(150,52,42,.28)'; g.lineWidth=1; g.setLineDash([7,5]); g.stroke(); g.setLineDash([]);
    const c=p[0]; g.font='12px serif'; g.textAlign='left';
    g.lineWidth=2.4; g.strokeStyle='rgba(236,228,206,.75)'; g.strokeText(s.n,c[0]+5,c[1]+14);
    g.fillStyle='rgba(140,58,44,.72)'; g.fillText(s.n,c[0]+5,c[1]+14);
  });

  // 长城三重 + 沿线烽燧
  WALLS.forEach((w,idx)=>{
    const p=P(w.p);
    line(g,p,'rgba(84,68,48,.75)',w.w+1.6,.7);
    line(g,p,'rgba(214,198,160,.62)',w.w*.5,.55,[9,5]);
    for(let k=0;k<p.length-1;k++){
      const a=p[k],b=p[k+1],seg=Math.hypot(b[0]-a[0],b[1]-a[1]);
      let t=0.02+rnd(k*3.7+idx)*0.05;
      while(t<0.98){
        if(rnd(k*11.3+t*97+idx)>.36){
          const x=lerp(a[0],b[0],t)+(rnd(t*211)-.5)*4;
          const y=lerp(a[1],b[1],t)+(rnd(t*173)-.5)*4;
          beacon(g,x,y,idx,rnd(t*311));
        }
        t += (46+rnd(k*7.1+t*131)*52)/seg;   // 不等距，不再像等距图章
      }
    }
  });

  // 官渡核心：对峙阵线（东西连营数十里）、沙堆、乌巢、屯田沟洫
  const gy=lat2y(35.0), gx0=lon2x(113.9), gx1=lon2x(115.0);
  // 袁营（北，赭黄）/ 曹营（南，深绿）
  for(let k=0;k<22;k++){
    const x=lerp(gx0,gx1,k/21)+(rnd(k*4.1)-.5)*4;
    line(g,[[x-9,gy-13],[x+9,gy-13]],'rgba(122,86,52,.7)',1.4,.7,[6,4]);
    line(g,[[x-9,gy+13],[x+9,gy+13]],'rgba(48,84,66,.75)',1.4,.7,[6,4]);
    if(k%3===0){
      g.strokeStyle='rgba(150,110,62,.6)'; g.lineWidth=1;
      g.strokeRect(x-5,gy-19,10,5);
      g.strokeStyle='rgba(46,78,62,.65)'; g.strokeRect(x-5,gy+14,10,5);
    }
  }
  // 沙堆：断续短弧
  for(let k=0;k<16;k++){
    const x=lerp(gx0,gx1,rnd(k*7.7)), y=gy-8+rnd(k*3.9)*5;
    brush(g,[[x-6,y],[x,y-3],[x+7,y]],1.4,.2,'rgba(176,142,94,.7)',.6);
  }
  // 屯田沟洫（许都方向，稀疏）
  for(let k=0;k<9;k++){
    const x=lon2x(113.6)+k*4.5, y=lat2y(33.98)+ (rnd(k*2.3)-.5)*8;
    brush(g,[[x,y-6],[x+1,y],[x,y+7]],.7,.1,'rgba(96,110,76,.6)',.5);
  }
  // 乌巢粮囤
  const wx=lon2x(114.75), wy=lat2y(35.45);
  for(let q=0;q<4;q++) g.strokeRect(wx-9+q*5,wy-5,4,10);
  g.fillStyle='rgba(120,60,48,.75)'; g.font='11px serif'; g.fillText('乌巢',wx+12,wy+4);

  // 州治 / 郡治分级
  CAPITALS.forEach((p,idx)=>{
    const x=lon2x(p.l), y=lat2y(p.t);
    if(p.k==='capital'){
      g.fillStyle='rgba(238,230,208,.82)'; g.fillRect(x-6,y-6,12,12);
      g.strokeStyle='rgba(72,56,36,.9)'; g.lineWidth=1.6; g.strokeRect(x-6,y-6,12,12);
      g.strokeStyle='rgba(200,168,106,.85)'; g.lineWidth=.8; g.strokeRect(x-8,y-8,16,16);
      g.fillStyle='rgba(38,32,24,.92)'; g.font='bold 13px serif'; g.textAlign='center';
      g.fillText(p.n, x, y-12);
    } else {
      g.fillStyle='rgba(72,60,42,.78)'; g.fillRect(x-2.5,y-2.5,5,5);
      g.fillStyle='rgba(52,44,32,.72)'; g.font='10px serif'; g.textAlign='center';
      g.fillText(p.n, x, y-6);
    }
  });

  // 题识、比例尺、朱印（随图走，不悬在纸外）
  g.textAlign='left'; g.fillStyle='rgba(40,34,26,.9)'; g.font='bold 24px serif';
  g.fillText('建安五年 · 十三州全境', 36, 56);
  g.font='12px serif'; g.fillStyle='rgba(72,60,44,.8)';
  g.fillText('西止玉门 · 东含乐浪 · 南尽日南 · 纵横不拘实距', 38, 78);
  // 比例尺
  const sx=W-236, sy=H-92;
  g.strokeStyle='rgba(60,50,36,.8)'; g.lineWidth=1.4;
  g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+180,sy); g.moveTo(sx,sy-4); g.lineTo(sx,sy+4);
  g.moveTo(sx+90,sy-3); g.lineTo(sx+90,sy+3); g.moveTo(sx+180,sy-4); g.lineTo(sx+180,sy+4); g.stroke();
  g.fillStyle='rgba(60,50,36,.85)'; g.font='11px serif'; g.textAlign='center';
  g.fillText('约千里',sx+90,sy-8);
  // 朱印
  g.save(); g.translate(W-72,H-158); g.rotate(-.04);
  g.fillStyle='rgba(166,49,41,.82)'; g.fillRect(-22,-22,44,44);
  g.strokeStyle='rgba(243,231,210,.8)'; g.lineWidth=1.4; g.strokeRect(-18,-18,36,36);
  g.fillStyle='#f3e7d2'; g.font='bold 19px serif'; g.textAlign='center';
  g.fillText('建安',0,-2); g.fillText('五年',0,17); g.restore();
  return c;
}
function beacon(g,x,y,idx,k){
  const s=3.0+k*2.4;                      // 大小不一
  g.fillStyle='rgba(226,210,172,.85)'; g.fillRect(x-s,y-s,s*2,s*2);
  g.strokeStyle='rgba(78,62,42,.82)'; g.lineWidth=.9; g.strokeRect(x-s,y-s,s*2,s*2);
  g.fillStyle='rgba(78,62,42,.8)';
  g.fillRect(x-s-1,y-s-2,1.6,1.6); g.fillRect(x+s-.6,y-s-2,1.6,1.6);
  if(idx===0 && k>.62){                 // 积薪：仅部分台有
    brush(g,[[x,y-s-2],[x+1,y-s-5],[x+1,y-s-9]],.9,.2,'rgba(120,96,64,.5)',.55);
  }
}

/* ---------- 合成 + 格网 LOD ---------- */
function composite(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0e1310'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+panX,H/2+panY); ctx.scale(zoom,zoom); ctx.translate(-W/2,-H/2);
  if(bg) ctx.drawImage(bg,0,0);
  if(showFeatures && fg) ctx.drawImage(fg,0,0);
  ctx.restore();
  // 格网：墨底 + 亮金双色，按 zoom 连续退场
  let state='格网 · 全隐';
  if(showGrid){
    const z=zoom, cell=46*z, alphaFine=clamp((z-0.62)/0.32,0,1), alphaMajor=clamp((z-0.38)/0.30,0,1);
    if(alphaFine>0.01){
      ctx.save(); ctx.globalAlpha=alphaFine*.30;
      ctx.strokeStyle='#c8a86a'; ctx.lineWidth=1/z;
      ctx.beginPath();
      for(let x=(panX%cell+cell)%cell;x<W;x+=cell){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
      for(let y=(panY%cell+cell)%cell;y<H;y+=cell){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
      ctx.stroke(); ctx.restore();
    }
    if(alphaMajor>0.01){
      ctx.save(); ctx.globalAlpha=alphaMajor*.50;
      ctx.strokeStyle='#e0c287'; ctx.lineWidth=1.3/z;
      const m=cell*5; ctx.beginPath();
      for(let x=(panX%m+m)%m;x<W;x+=m){ ctx.moveTo(x,0); ctx.lineTo(x,H); }
      for(let y=(panY%m+m)%m;y<H;y+=m){ ctx.moveTo(0,y); ctx.lineTo(W,y); }
      ctx.stroke(); ctx.restore();
    }
    state = z>=0.94 ? '格网 · 全显' : z>=0.62 ? '格网 · 抽稀' : z>=0.38 ? '格网 · 主格' : '格网 · 全隐';
  } else state='格网 · 关闭';
  document.getElementById('gridState').textContent =
    `${state} · ×${zoom.toFixed(2)} · 格距 ${(46*zoom).toFixed(0)}px`;
}
function rebuild(){ bg=makeBg(); fg=makeFg(); composite(); }

/* ---------- 交互 ---------- */
function setZoom(nz,cx,cy){
  const n=clamp(nz,0.28,4.2);
  if(cx!==undefined){
    panX = cx-(cx-panX)*(n/zoom); panY = cy-(cy-panY)*(n/zoom);
  }
  zoom=n; composite();
}
document.getElementById('redraw').onclick=()=>{ seed=Math.floor(Math.random()*99991)+1; rebuild(); };
document.getElementById('toggleFeatures').onclick=e=>{ showFeatures=!showFeatures; e.target.setAttribute('aria-pressed',showFeatures); composite(); };
document.getElementById('toggleGrid').onclick=e=>{ showGrid=!showGrid; e.target.setAttribute('aria-pressed',showGrid); composite(); };
document.getElementById('zoomIn').onclick=()=>setZoom(zoom*1.28);
document.getElementById('zoomOut').onclick=()=>setZoom(zoom/1.28);
document.getElementById('reset').onclick=()=>{ zoom=1; panX=0; panY=0; composite(); };
cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect();
  setZoom(zoom*(e.deltaY<0?1.12:1/1.12), e.clientX-r.left, e.clientY-r.top); },{passive:false});
cv.addEventListener('pointerdown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; cv.classList.add('drag'); cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove',e=>{ if(!dragging)return; panX+=e.clientX-lastX; panY+=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY; composite(); });
cv.addEventListener('pointerup',()=>{ dragging=false; cv.classList.remove('drag'); });
window.addEventListener('resize',composite);
rebuild();
})();
</script>
</body>
