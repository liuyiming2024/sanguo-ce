name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 全部模块语法检查
        run: |
          for f in src/*.js scripts/*.mjs tests/*.mjs; do node --check "$f"; done

      - name: 单元测试
        run: npm test

      - name: 地图 / 连通性 / 导航 / 版本指纹静态自检
        run: npm run check

      - name: Pages 静态入口自检
        run: |
          test -f index.html
          test -f .nojekyll
          test -f config/campaign.json
          test -f src/main.js
          grep -q 'type="module"' index.html
          grep -q 'type="module"' index.html
          V=$(node --input-type=module -e "import {VERSION} from './src/version.js'; process.stdout.write(VERSION)")
          echo "唯一版本源 src/version.js -> $V"
          case "$V" in 0.*) ;; *) echo '大版本号必须保持 0'; exit 1;; esac
          grep -q 'src/version.js' index.html
          grep -q 'cfg.meta.version = VERSION' src/main.js
          if grep -qE '\?v=[0-9]+\.[0-9]+' index.html; then echo 'HTML 又写死了版本戳'; exit 1; fi
          if grep -rE '\?v=[0-9]+\.[0-9]+' src/ scripts/; then echo '源码又写死了版本戳'; exit 1; fi
